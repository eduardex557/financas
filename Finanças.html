/* ===== ETAPA 4: comprovantes/documentos e backup completo (ZIP) =====
 Metadados em 'attachments' {id,ownerType:'tx'|'product'|'loan',ownerId,txId?(só tx),name,mime,size,hash,docType,description,notes,categoryId,recordLabel,ownerKind,createdAt,replacedAt?,history?}
 Arquivos em 'attachmentBlobs' {id,blob}. O registro dono guarda só attachmentIds. Validação: extensão + assinatura (magic bytes) + limite (settings.maxFileMB, padrão 10).
 Todas as gravações (metadado + arquivo + dono) ocorrem em UMA transação. Anexo sempre exige dono existente (sem órfãos). */
const DOC_EXT={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'};
const DOC_TYPES=['Comprovante de pagamento','Nota fiscal','Boleto','Fatura','Contrato','Recibo','Extrato','Outro'];
const KIND4={receita:'Receita',despesa:'Despesa',pagamento_fatura:'Pagamento de fatura',parcela_produto:'Parcela de produto',prestacao:'Prestação de financiamento',amortizacao:'Amortização extraordinária',produto:'Compra parcelada',financiamento:'Financiamento'};
const OWN_STORE={tx:'transactions',product:'products',loan:'financings'};
const maxBytes=()=>Math.round((Number(S.settings.maxFileMB)>0?Number(S.settings.maxFileMB):10)*1048576);
const fmtB=n=>n>=1048576?(n/1048576).toFixed(n>=10485760?1:2).replace('.',',')+' MB':n>=1024?Math.round(n/1024)+' KB':n+' B';
const aOwn=a=>({type:a.ownerType||'tx',id:a.ownerId||a.txId});
const sameOwn=(a,o)=>{const x=aOwn(a);return x.type===o.type&&x.id===o.id};
const ownerRec=(t,id)=>t==='tx'?S.tx.find(x=>x.id===id):t==='product'?S.prod.find(x=>x.id===id):t==='loan'?S.fin.find(x=>x.id===id):null;
const ownerLabel=(t,r)=>t==='tx'?`${r.description} · ${fdate(r.date)} · ${brl(r.amount)}`:r.name;
const ownerCat=(t,r)=>t==='loan'?catFin():r.categoryId;
const kindOf=(t,r)=>t==='product'?'produto':t==='loan'?'financiamento':r.type==='receita'?'receita':r.type==='pagamento_fatura'?'pagamento_fatura':r.type==='amortizacao'?'amortizacao':r.productId?'parcela_produto':r.loanId?'prestacao':'despesa';
const docsOf=(t,id)=>S.att.filter(a=>sameOwn(a,{type:t,id}));
const docCount=(pred)=>S.att.filter(a=>{const o=aOwn(a);if(o.type==='tx'){const t=S.tx.find(x=>x.id===o.id);return !!t&&pred(t)}return false}).length;
const docNote=n=>n?`\n\n⚠ ${n} documento(s) anexado(s) também serão excluídos.`:'';
/* ---- hash / assinatura ---- */
async function fileHash(u,algo){
 algo=algo||(globalThis.crypto&&crypto.subtle?'sha256':'fnv');
 if(algo==='sha256'){
  if(!(globalThis.crypto&&crypto.subtle))throw new Error('Verificação SHA-256 indisponível neste navegador');
  return 'sha256:'+[...new Uint8Array(await crypto.subtle.digest('SHA-256',u))].map(b=>b.toString(16).padStart(2,'0')).join('');
 }
 let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<u.length;i++){h1=Math.imul(h1^u[i],16777619)>>>0;h2=Math.imul(h2^u[i],2246822519)>>>0}
 return `fnv:${h1.toString(16)}${h2.toString(16)}:${u.length}`;
}
const hashWith=async(h,u)=>{const a=String(h).split(':')[0];if(a==='sha256'&&!(globalThis.crypto&&crypto.subtle))return h; /* sem SHA-256 (ex.: file:// ou HTTP): vale a verificação de tamanho e CRC32 já feita em zipRead */return fileHash(u,a)};
function sniff(u){
 const h=(...a)=>a.every((b,i)=>u[i]===b);
 if(h(0x25,0x50,0x44,0x46))return 'application/pdf';
 if(h(0xFF,0xD8,0xFF))return 'image/jpeg';
 if(h(0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A))return 'image/png';
 if(u.length>12&&h(0x52,0x49,0x46,0x46)&&u[8]===0x57&&u[9]===0x45&&u[10]===0x42&&u[11]===0x50)return 'image/webp';
 return null;
}
async function prepFile(f,max){
 const name=String(f.name||'').split(/[\\/]/).pop().trim().slice(0,120);
 if(!name)throw new Error('arquivo sem nome');
 const ext=(name.includes('.')?name.split('.').pop():'').toLowerCase();
 if(!DOC_EXT[ext])throw new Error('formato não permitido (use PDF, JPG, JPEG, PNG ou WEBP)');
 if(!(f.size>0))throw new Error('arquivo vazio');
 if(f.size>max)throw new Error(`tamanho ${fmtB(f.size)} excede o limite de ${fmtB(max)}`);
 const u=new Uint8Array(await f.arrayBuffer()),mime=sniff(u);
 if(mime!==DOC_EXT[ext])throw new Error('o conteúdo não corresponde à extensão (arquivo inválido ou corrompido)');
 return{name,mime,size:u.length,hash:await fileHash(u),blob:new Blob([u],{type:mime})};
}
async function storageInfo(){try{const e=await navigator.storage?.estimate?.();return e&&e.quota?{usage:e.usage||0,quota:e.quota}:null}catch(_){return null}}
async function checkSpace(n){
 const i=await storageInfo();
 if(i&&i.quota-i.usage<n+5242880)throw new Error(`Espaço de armazenamento insuficiente: disponível ≈ ${fmtB(Math.max(0,i.quota-i.usage))}. Exclua documentos ou libere espaço no navegador.`);
 return i;
}
const quotaMsg=e=>e&&e.name==='QuotaExceededError'?'Armazenamento do navegador cheio: nada foi salvo. Exclua documentos ou libere espaço.':((e&&e.message)||'Falha ao gravar');
async function addDocs(own,files,m={}){
 const rec=ownerRec(own.type,own.id);
 if(!rec)throw new Error('Registro financeiro inexistente: não é possível anexar documentos órfãos');
 const lst=[...files];if(!lst.length)throw new Error('Selecione ao menos um arquivo');
 const max=maxBytes(),prep=[],errs=[];
 for(const f of lst){try{prep.push(await prepFile(f,max))}catch(e){errs.push(`${(f&&f.name)||'arquivo'}: ${e.message}`)}}
 if(errs.length)throw new Error('Nenhum arquivo foi salvo.\n'+errs.join('\n'));
 const keep=[];
 for(const p of prep){
  const d=S.att.filter(a=>a.hash===p.hash&&a.size===p.size);
  if(d.some(a=>sameOwn(a,own))||keep.some(x=>x.hash===p.hash))throw new Error(`"${p.name}" já está anexado a este registro (arquivo idêntico)`);
  if(d.length&&!confirm(`"${p.name}" é idêntico a um documento já anexado a outro registro. Anexar mesmo assim?`))continue;
  keep.push(p);
 }
 if(!keep.length)return [];
 const info=await checkSpace(keep.reduce((s,p)=>s+p.size,0));
 const stamp=nowIso(),store=OWN_STORE[own.type],lab=ownerLabel(own.type,rec),kd=kindOf(own.type,rec),cat=ownerCat(own.type,rec);
 const metas=keep.map(p=>({id:uid(),ownerType:own.type,ownerId:own.id,...(own.type==='tx'?{txId:own.id}:{}),name:p.name,mime:p.mime,size:p.size,hash:p.hash,
  docType:DOC_TYPES.includes(m.docType)?m.docType:'Outro',description:String(m.description||'').trim().slice(0,200),notes:String(m.notes||'').trim().slice(0,300),categoryId:cat,recordLabel:lab,ownerKind:kd,createdAt:stamp}));
 const rec2={...rec,attachmentIds:[...(rec.attachmentIds||[]),...metas.map(x=>x.id)]};
 try{await DB.run(['attachments','attachmentBlobs',store],'readwrite',s=>{metas.forEach((x,i)=>{s.attachments.put(x);s.attachmentBlobs.put({id:x.id,blob:keep[i].blob})});s[store].put(rec2)})}
 catch(e){throw new Error(quotaMsg(e))}
 await load();
 return metas.map(x=>x.id);
}
async function replaceDoc(id,file){
 const a=S.att.find(x=>x.id===id);if(!a)throw new Error('Documento não encontrado');
 const o=aOwn(a);if(!ownerRec(o.type,o.id))throw new Error('Registro associado inexistente');
 const p=await prepFile(file,maxBytes());
 if(S.att.some(x=>x.id!==id&&sameOwn(x,o)&&x.hash===p.hash))throw new Error('Já existe um documento idêntico neste registro');
 await checkSpace(Math.max(0,p.size-a.size));
 const a2={...a,name:p.name,mime:p.mime,size:p.size,hash:p.hash,replacedAt:nowIso(),history:[...(a.history||[]),{at:nowIso(),name:a.name,size:a.size,hash:a.hash}].slice(-20)};
 try{await DB.run(['attachments','attachmentBlobs'],'readwrite',s=>{s.attachmentBlobs.put({id,blob:p.blob});s.attachments.put(a2)})}catch(e){throw new Error(quotaMsg(e))}
 await load();
}
async function updateDocMeta(id,m){
 const a=S.att.find(x=>x.id===id);if(!a)throw new Error('Documento não encontrado');
 const a2={...a,docType:DOC_TYPES.includes(m.docType)?m.docType:a.docType,description:String(m.description??a.description??'').trim().slice(0,200),notes:String(m.notes??a.notes??'').trim().slice(0,300)};
 await DB.run(['attachments'],'readwrite',s=>{s.attachments.put(a2)});await load();
}
async function deleteDocs(ids){
 const set=new Set(ids),metas=S.att.filter(a=>set.has(a.id));if(!metas.length)throw new Error('Documento não encontrado');
 const recs=new Map();
 metas.forEach(a=>{const o=aOwn(a),r=ownerRec(o.type,o.id);if(r){const k=o.type+':'+o.id,c=recs.get(k)||{type:o.type,r:{...r}};c.r.attachmentIds=(c.r.attachmentIds||[]).filter(x=>!set.has(x));recs.set(k,c)}});
 await DB.run(['attachments','attachmentBlobs','transactions','products','financings'],'readwrite',s=>{
  metas.forEach(a=>{s.attachments.delete(a.id);s.attachmentBlobs.delete(a.id)});
  recs.forEach(c=>s[OWN_STORE[c.type]].put(c.r));
 });
 await load();
}
async function docBlob(id){
 const r=await DB.run(['attachmentBlobs'],'readonly',s=>s.attachmentBlobs.get(id));
 if(!r||!r.blob)throw new Error('Arquivo não encontrado no armazenamento');
 return r.blob;
}
async function saveDocLimit(mb){
 const v=Number(mb);if(!(v>=0.1&&v<=200))throw new Error('Limite inválido: informe de 0,1 a 200 MB');
 const s={...S.settings,maxFileMB:v};await DB.put('settings',s);S.settings=s;
}
/* ---- ZIP (sem compressão, CRC32) ---- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipBuild(files){
 if(files.length>65000)throw new Error('Muitos arquivos para um único ZIP');
 const enc=new TextEncoder(),parts=[],cd=[];let off=0,tot=0;
 const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
 for(const f of files){
  const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;tot+=sz;
  if(tot>4e9)throw new Error('Backup excede o limite de 4 GB do formato ZIP');
  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
  parts.push(lh,nm,f.data);cd.push({nm,crc,sz,off});off+=lh.length+nm.length+sz;
 }
 let cdSize=0;
 for(const e of cd){
  const h=new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(e.crc),...u32(e.sz),...u32(e.sz),...u16(e.nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(e.off)]);
  parts.push(h,e.nm);cdSize+=h.length+e.nm.length;
 }
 parts.push(new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(cd.length),...u16(cd.length),...u32(cdSize),...u32(off),...u16(0)]));
 return parts;
}
async function zipRead(u8){
 const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);let e=-1;
 for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
 if(e<0)throw new Error('Arquivo ZIP inválido ou incompleto (diretório central não encontrado)');
 const n=dv.getUint16(e+10,true),dec=new TextDecoder(),out=new Map();let p=dv.getUint32(e+16,true);
 for(let k=0;k<n;k++){
  if(p+46>u8.length||dv.getUint32(p,true)!==0x02014b50)throw new Error('ZIP corrompido (entrada inválida)');
  const method=dv.getUint16(p+10,true),crc=dv.getUint32(p+16,true),csz=dv.getUint32(p+20,true),usz=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=dec.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
  if(lo+30>u8.length||dv.getUint32(lo,true)!==0x04034b50)throw new Error(`ZIP corrompido (cabeçalho de "${name}")`);
  const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
  if(ds+csz>u8.length)throw new Error(`ZIP truncado em "${name}"`);
  let data=u8.subarray(ds,ds+csz);
  if(method===8){
   if(typeof DecompressionStream==='undefined')throw new Error('Este navegador não consegue descompactar este ZIP (use um backup gerado por este aplicativo)');
   data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  }else if(method!==0)throw new Error('ZIP com método de compressão não suportado');
  if(data.length!==usz||crc32(data)!==crc)throw new Error(`Arquivo "${name}" corrompido no ZIP (CRC não confere)`);
  out.set(name,data);
 }
 return out;
}

async function exportZip(){
 const snap=await DB.run(DB.ST,'readonly',s=>DB.ST.map(n=>s[n].getAll())),data={};
 DB.ST.forEach((n,i)=>{data[n]=snap[i]});
 const blobs=new Map(data.attachmentBlobs.map(b=>[b.id,b.blob]));delete data.attachmentBlobs;
 const files=[],man=[];
 for(const a of data.attachments){
  const b=blobs.get(a.id);
  if(!b)throw new Error(`O documento "${a.name}" não tem arquivo no armazenamento. Backup interrompido para não gerar uma cópia incompleta.`);
  const u=new Uint8Array(await b.arrayBuffer()),hash=await fileHash(u);
  if(a.hash&&a.hash.startsWith(hash.split(':')[0])&&a.hash!==hash)throw new Error(`O documento "${a.name}" falhou na verificação de integridade. Backup interrompido.`);
  const path=`documentos/${a.id}.${((a.name||'').split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin'}`;
  files.push({name:path,data:u});man.push({path,id:a.id,size:u.length,hash});
 }
 const enc=new TextEncoder(),at=new Date().toISOString();
 const manifest={app:'financas-pessoais',format:'zip-v1',schemaVersion:SCHEMA,exportedAt:at,counts:Object.fromEntries(Object.entries(data).map(([k,v])=>[k,v.length])),files:man};
 const all=[{name:'manifest.json',data:enc.encode(JSON.stringify(manifest,null,1))},{name:'dados.json',data:enc.encode(JSON.stringify({app:'financas-pessoais',schemaVersion:SCHEMA,exportedAt:at,data}))},...files];
 download(`backup-completo-${today()}.zip`,new Blob(zipBuild(all),{type:'application/zip'}));
 toast(`Backup completo exportado (${data.attachments.length} documento(s))`);
}
function checkDocs(p,strict){
 const bad=m=>{throw new Error(m)};
 const ids={tx:new Set(p.transactions.map(x=>x.id)),product:new Set(p.products.map(x=>x.id)),loan:new Set(p.financings.map(x=>x.id))};
 const bl=new Map(p.attachmentBlobs.map(b=>[b.id,b.blob]));
 p.attachments.forEach(a=>{
  const w=`Documento ${a.id}`;
  if(typeof a.name!=='string'||!a.name.trim())bad(`${w}: sem identificação (nome)`);
  const o=aOwn(a);
  if((strict||a.ownerType)&&!(ids[o.type]&&ids[o.type].has(o.id)))bad(`${w} ("${a.name}"): registro associado inexistente (anexo órfão)`);
  const b=bl.get(a.id);if(!b)bad(`${w} ("${a.name}"): arquivo ausente no backup`);
  if(strict&&b.size!==a.size)bad(`${w} ("${a.name}"): tamanho diferente do registrado`);
  if(strict&&!Object.values(DOC_EXT).includes(a.mime))bad(`${w}: tipo de arquivo não permitido`);
 });
 const am=new Set(p.attachments.map(a=>a.id));
 p.attachmentBlobs.forEach(b=>{if(!am.has(b.id))bad(`Arquivo ${b.id} sem metadados (anexo sem identificação)`)});
}
async function restoreParsed(p,extra=''){
 if(!confirm(`Restaurar SUBSTITUI todos os dados atuais por: ${p.transactions.length} lançamentos, ${p.cards.length} cartões, ${p.accounts.length} contas, ${p.products.length} produtos parcelados, ${p.financings.length} financiamentos e ${p.attachments.length} documento(s)${extra}.\nA restauração é atômica: se algo falhar, os dados atuais permanecem intactos. Continuar?`))return false;
 try{await DB.run(DB.ST,'readwrite',s=>{DB.ST.forEach(n=>{s[n].clear();p[n].forEach(o=>s[n].put(o))})})}catch(e){throw new Error('Restauração não concluída; seus dados atuais foram mantidos. '+quotaMsg(e))}
 await load();await seed();await migrate();render();toast('Backup restaurado');return true;
}
async function importZip(file){
 let z;try{z=await zipRead(new Uint8Array(await file.arrayBuffer()))}catch(e){throw new Error(e.message||'ZIP inválido')}
 const dec=new TextDecoder(),get=n=>{const d=z.get(n);if(!d)throw new Error(`Backup incompleto: "${n}" ausente`);return d};
 let man,dj;try{man=JSON.parse(dec.decode(get('manifest.json')));dj=JSON.parse(dec.decode(get('dados.json')))}catch(e){throw new Error(/^Backup/.test(e.message)?e.message:'Backup ZIP com JSON inválido')}
 if(!man||man.app!=='financas-pessoais'||man.format!=='zip-v1'||!Array.isArray(man.files))throw new Error('Arquivo não é um backup completo deste aplicativo');
 const p=parseBackup(dj);
 Object.entries(man.counts||{}).forEach(([k,v])=>{if(k!=='attachmentBlobs'&&p[k]&&p[k].length!==v)throw new Error(`Backup inconsistente: "${k}" tem ${p[k].length} registro(s), manifesto indica ${v}`)});
 const meta=new Map(p.attachments.map(a=>[a.id,a])),blobs=[];
 for(const f of man.files){
  const d=get(f.path),a=meta.get(f.id);
  if(!a)throw new Error(`Arquivo ${f.id} sem metadados no backup`);
  if(d.length!==f.size)throw new Error(`Documento "${a.name}": tamanho diferente do manifesto`);
  if(await hashWith(f.hash,d)!==f.hash)throw new Error(`Documento "${a.name}": falha na verificação de integridade`);
  blobs.push({id:f.id,blob:new Blob([d],{type:a.mime||''})});
 }
 p.attachmentBlobs=blobs;checkDocs(p,true);
 return restoreParsed(p,` (integridade de ${blobs.length} arquivo(s) verificada)`);
}
async function importAny(file){
 const h=new Uint8Array(await file.slice(0,2).arrayBuffer());
 if(h[0]===0x50&&h[1]===0x4b)return importZip(file);
 return importBackup(file);
}

/* ===== ETAPA 5A: relatórios financeiros =====
 Nenhuma lógica financeira nova: reutiliza ctx() (X.paid/X.real/X.inv), aggregate(X,keep), cardStats, prodStats, loanState e s3Report.
 Regras: compra no cartão = despesa na data da compra (nunca no pagamento da fatura); pagamento de fatura = saída de caixa; transferência não é receita/despesa;

 const pRowsM=ms.map(m=>{const o=pm.get(m);return[mlab(m),o.p/100,o.l/100,o.j/100,o.pr/100,o.a/100]});
 const kpis=[['Produtos: saldo a pagar',sum(pr,x=>x.s.pendC/100),`pago ${brl(sum(pr,x=>x.s.paidC/100))}`],['Parcelas vencidas',pr.reduce((s,x)=>s+x.s.overdue.length,0)+lr.reduce((s,x)=>s+x.v.pend.filter(t=>t.dueDate<td).length,0),'produtos + financiamentos','n'],['Financiamentos: saldo devedor',sum(lr.filter(x=>x.l.status==='ativo'),x=>x.v.estC/100),'estimado/informado — NÃO é despesa do período'],['Prestações pagas (total)',sum(lr,x=>x.v.totalPaidC/100),`juros ${brl(sum(lr,x=>x.v.interestPaidC/100))} · amortizações extra ${brl(sum(lr,x=>x.v.amortC/100))}`]];
 const sections=[{title:'Compras parceladas fora do cartão (valores registrados)',head:[{h:'Produto'},{h:'Situação'},{h:'Pagas'},{h:'Pendentes'},{h:'Vencidas'},{h:'Total pago',m:1},{h:'Saldo a pagar',m:1}],rows:pRows},
  {title:'Financiamentos e empréstimos (pendentes e saldo são ESTIMADOS, salvo indicação)',head:[{h:'Contrato'},{h:'Situação'},{h:'Sistema'},{h:'Pagas'},{h:'Restantes'},{h:'Vencidas'},{h:'Total pago',m:1},{h:'Juros pagos',m:1},{h:'Amortização do principal',m:1},{h:'Encargos pagos',m:1},{h:'Amortizações extraordinárias',m:1},{h:'Saldo devedor',m:1},{h:'Origem do saldo'}],rows:lRows},
  {title:'Compromissos futuros por mês (produtos: registrado · financiamentos: estimado · faturas em aberto)',head:[{h:'Mês'},{h:'Produtos parcelados',m:1},{h:'Financiamentos (estimado)',m:1},{h:'Faturas de cartão',m:1},{h:'Total',m:1}],rows:cRows},
  {title:'Evolução dos pagamentos efetuados (valores registrados)',head:[{h:'Mês'},{h:'Produtos parcelados',m:1},{h:'Prestações de financiamento',m:1},{h:'  dos quais juros',m:1},{h:'  dos quais amortização',m:1},{h:'Amortizações extraordinárias (fora das prestações)',m:1}],rows:pRowsM}];
 const lab=ms.map(m=>mShort(m)+(ms.length>12?'/'+m.slice(2,4):''));
 const charts=ms.length?[['Compromissos financeiros futuros',rBars(lab,[{n:'Produtos',c:'var(--pri)',v:cRows.map(r=>r[1])},{n:'Financiamentos (estimado)',c:'#8b5cf6',v:cRows.map(r=>r[2])},{n:'Faturas',c:'#f59e0b',v:cRows.map(r=>r[3])}]),''],
  ['Pagamentos efetuados',rBars(lab,[{n:'Produtos',c:'var(--pri)',v:pRowsM.map(r=>r[1])},{n:'Prestações',c:'#8b5cf6',v:pRowsM.map(r=>r[2])},{n:'Amortizações extra',c:'var(--ok)',v:pRowsM.map(r=>r[5])}]),'']]:[];
 return{kpis,sections,charts,data:{pRows,lRows,cRows,pRowsM}};
}
/* ---- E: por categoria ---- */
function repE(c){
 const {f,R,X,td,mode}=c,kind=f.type==='receita'?'receita':'despesa',keep=rKeep({...f,type:''},X,td),P=prevRange(R);
 const col=(rg)=>{const m=new Map();S.tx.forEach(t=>{if(t.type!==kind||t.date<rg.from||t.date>rg.to||!keep(t))return;const real=rReal(t,X);if(!rMode(real))return;m.set(t.categoryId,(m.get(t.categoryId)||0)+cents(t.amount))});return m};
 function rMode(real){return mode==='real'?real:mode==='prev'?!real:true}
 const cur=col(R),prv=col(P),tot=[...cur.values()].reduce((a,b)=>a+b,0),ptot=[...prv.values()].reduce((a,b)=>a+b,0);
 const ids=[...new Set([...cur.keys(),...prv.keys()])].sort((a,b)=>(cur.get(b)||0)-(cur.get(a)||0));
 const ms=monthsIn(R.from,R.to),top=ids.filter(i=>cur.get(i)).slice(0,6);
 const mv=new Map();S.tx.forEach(t=>{if(t.type!==kind||t.date<R.from||t.date>R.to||!keep(t)||!rMode(rReal(t,X)))return;const k=t.categoryId+'|'+ymOf(t.date);mv.set(k,(mv.get(k)||0)+cents(t.amount))});
 const share=ids.filter(i=>cur.get(i)).map(i=>[catOf(i).name,(cur.get(i)||0)/100,pc1(tot?cur.get(i)/tot*100:0)]);
 const cmp=ids.map(i=>{const a=cur.get(i)||0,b=prv.get(i)||0;return[catOf(i).name,a/100,b/100,(a-b)/100,b?pc1((a-b)/b*100):(a?'novo':'—')]});
 const evo=ids.filter(i=>cur.get(i)).map(i=>[catOf(i).name,...ms.map(m=>(mv.get(i+'|'+m)||0)/100)]);
 const lab=ms.map(m=>mShort(m)+(ms.length>12?'/'+m.slice(2,4):''));
 const pal=['var(--pri)','#8b5cf6','#f59e0b','#14b8a6','#ec4899','var(--bad)'];
 const kpis=[[kind==='despesa'?'Total de despesas':'Total de receitas',tot/100,`${fdate(R.from)} a ${fdate(R.to)}`],['Período anterior',ptot/100,`${fdate(P.from)} a ${fdate(P.to)}`],['Variação',(tot-ptot)/100,ptot?pc1((tot-ptot)/ptot*100):'—'],['Maior participação',top[0]?catOf(top[0]).name:'—',top[0]&&tot?pc1(cur.get(top[0])/tot*100):'']];
 const sections=[{title:`Participação por categoria (${kind==='despesa'?'despesas':'receitas'})`,head:[{h:'Categoria'},{h:'Total',m:1},{h:'% do total'}],rows:share},
  {title:'Comparação com o período anterior',head:[{h:'Categoria'},{h:'Período atual',m:1},{h:'Período anterior',m:1},{h:'Diferença',m:1},{h:'Variação'}],rows:cmp},
  {title:'Evolução mensal por categoria',head:[{h:'Categoria'},...ms.map(m=>({h:mlab(m),m:1}))],rows:evo}];
 const charts=[['Participação por categoria',donut(ids.filter(i=>cur.get(i)).slice(0,8).map(i=>({n:catOf(i).name,v:cur.get(i)/100,c:catOf(i).color||'#94a3b8'}))),''],
  ['Evolução mensal das maiores categorias',ms.length&&top.length?rBars(lab,top.map((i,k)=>({n:catOf(i).name,c:pal[k],v:ms.map(m=>(mv.get(i+'|'+m)||0)/100)})),{stack:1}):'<div class="empty">Sem dados.</div>','']];
 return{kpis,sections,charts,data:{cur,prv,tot,ptot,share,cmp}};
}
const REPS={rd:['Receitas e despesas',repA],fc:['Fluxo de caixa',repB],ct:['Cartões de crédito',repC],pf:['Parcelamentos e financiamentos',repD],cg:['Por categoria',repE]};
function buildReport(tab=S.ui5.tab,over={}){
 const u=S.ui5,f={...u.f,...(over.f||{})},R=rRange(f),X=ctx(),td=today(),c={f,R,X,td,mode:over.mode||u.mode};
 if(R.err)return{c,err:R.err};
 return{c,rep:REPS[tab][1](c),title:REPS[tab][0]};
}
function rCsv(tab,over){
 const b=buildReport(tab,over);if(b.err)throw new Error(b.err);
 const q=v=>`"${String(v??'').replace(/"/g,'""')}"`,L=[q('Relatório: '+b.title),q(rDesc(b.c)),q('Gerado em '+fdate(today())),''];
 b.rep.kpis.forEach(k=>L.push([q(k[0]),typeof k[1]==='number'&&k[3]!=='n'?num2(k[1]):q(k[1]),q(k[2]||'')].join(';')));
 b.rep.sections.forEach(s=>{L.push('',q(s.title),s.head.map(h=>q(h.h)).join(';'));s.rows.forEach(r=>L.push(r.map((v,i)=>s.head[i]&&s.head[i].m&&typeof v==='number'?num2(v):q(v)).join(';')))});
 return L.join('\n');
}
function exportRelatCsv(){download(`relatorio-${S.ui5.tab}-${today()}.csv`,new Blob(['﻿'+rCsv(S.ui5.tab)],{type:'text/csv'}));toast('CSV exportado')}
/* gráfico de colunas (agrupado ou empilhado) no padrão visual dos demais */
function rBars(labels,series,{stack=false}={}){
 const W=560,H=210,p=26,n=labels.length;if(!n)return '';
 const tot=labels.map((_,i)=>stack?series.reduce((s,x)=>s+(x.v[i]||0),0):Math.max(...series.map(x=>x.v[i]||0))),max=Math.max(1,...tot)*1.1,ch=H-p*1.5,bw=(W-p*2)/n,gw=stack?bw*.6:bw*.8/series.length;
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
 for(let i=0;i<=4;i++){const y=p/2+ch*i/4;s+=`<line class="gl" x1="${p}" x2="${W-6}" y1="${y}" y2="${y}"/>`}
 s+=`<text class="ax" x="2" y="${p/2+4}">${max>=1000?Math.round(max/1000)+'k':Math.round(max)}</text>`;
 labels.forEach((l,i)=>{let acc=0;series.forEach((x,k)=>{const v=x.v[i]||0,h=ch*v/max,x0=stack?p+i*bw+bw*.2:p+i*bw+bw*.1+k*gw,y=stack?H-p-acc-h:H-p-h;if(v>0)s+=`<rect x="${x0}" y="${y}" width="${gw-2}" height="${h}" rx="3" fill="${x.c}"><title>${esc(x.n)} · ${l}: ${brl(v)}</title></rect>`;acc+=h});s+=`<text class="ax" x="${p+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${l}</text>`});
 return s+'</svg><div class="legend" style="justify-content:center;flex-wrap:wrap">'+series.map(x=>`<span style="--c:${x.c}">${esc(x.n)}</span>`).join('')+'</div>';
}

/* ===== ETAPA 5A: interface dos relatórios ===== */
S.ui5={tab:'rd',mode:'total',f:{preset:'mes',from:'',to:'',cat:'',type:'',acc:'',status:'',card:''}};
const fmtCell=(v,m)=>typeof v==='number'?(m?`<span class="${v<0?'neg':''}">${brl(v)}</span>`:String(v)):esc(v);
function r5Table(s){
 if(!s.rows.length)return `<h3 style="margin:16px 0 6px">${esc(s.title)}</h3><div class="empty">Sem dados para os filtros selecionados.</div>`;
 const last=s.rows.length>1&&s.rows.at(-1)[0]==='Total';
 return `<h3 style="margin:16px 0 6px">${esc(s.title)}</h3><div style="overflow:auto"><table class="tbl"><thead><tr>${s.head.map(h=>`<th class="${h.m?'n':''}">${esc(h.h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,i)=>`<tr${last&&i===s.rows.length-1?' style="font-weight:700"':''}>${r.map((v,j)=>`<td class="${s.head[j]&&s.head[j].m?'n':''}">${fmtCell(v,s.head[j]&&s.head[j].m)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function viewRelat(){
 const u=S.ui5,f=u.f,sel=(n,o,v,all)=>`<label class="fld">${n[1]}<select data-f5="${n[0]}">${all?`<option value="">${all}</option>`:''}${opts3(o,v)}</select></label>`;
 const cats=S.cats.map(c=>[c.id,`${c.emoji} ${c.name}`]),cards=S.cards.map(c=>[c.id,c.name]),accs=S.accts.map(a=>[a.id,a.name]);
 const b=buildReport(),cu=f.preset==='custom';
 const filt=`<div class="card no-print"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px">
  ${sel(['preset','Período'],RPRE,f.preset||'mes')}
  <label class="fld">Data inicial<input type="date" data-f5="from" value="${esc(cu?(b.c.R.from||f.from):b.c.R.from||'')}" ${cu?'':'disabled'}></label>
  <label class="fld">Data final<input type="date" data-f5="to" value="${esc(cu?(b.c.R.to||f.to):b.c.R.to||'')}" ${cu?'':'disabled'}></label>
  ${sel(['cat','Categoria'],cats,f.cat,'Todas')}${sel(['type','Tipo de movimentação'],RTYPES,f.type,'Todos')}
  ${sel(['acc','Conta bancária'],accs,f.acc,'Todas')}${sel(['status','Situação'],RSTAT,f.status,'Todas')}${sel(['card','Cartão'],cards,f.card,'Todos')}</div>
  <div class="btns" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><div class="tabs" style="margin:0"><button class="btn ${u.mode==='total'?'':'sec'}" data-act="r5mode" data-id="total">Realizado + previsto</button><button class="btn ${u.mode==='real'?'':'sec'}" data-act="r5mode" data-id="real">Só realizado</button><button class="btn ${u.mode==='prev'?'':'sec'}" data-act="r5mode" data-id="prev">Só previsto</button></div>
  <div class="btns"><button class="btn sec" data-act="r5clear">Limpar filtros</button><button class="btn sec" data-act="r5csv">⬇ CSV (Excel)</button><button class="btn" data-act="r5print">🖨 Imprimir / PDF</button></div></div></div>`;
 const tabs=`<div class="tabs no-print">${Object.entries(REPS).map(([k,v])=>`<button class="btn ${u.tab===k?'':'sec'}" data-act="r5tab" data-id="${k}">${v[0]}</button>`).join('')}</div>`;
 if(b.err)return `<h2 class="no-print" style="margin-bottom:12px">Relatórios</h2>${filt}${tabs}<div class="alert">${esc(b.err)}</div>`;
 const r=b.rep,hasData=S.tx.length||S.prod.length||S.fin.length;
 const kp=r.kpis.map(k=>`<div class="card kpi"><div class="l">${esc(k[0])}</div><div class="v">${typeof k[1]==='number'?(k[3]==='n'?k[1]:`<span class="${k[1]<0?'neg':''}">${brl(k[1])}</span>`):esc(k[1])}</div><div class="s">${esc(k[2]||'')}</div></div>`).join('');
 return `<h2 class="no-print" style="margin-bottom:12px">Relatórios</h2>${filt}${tabs}
 <div class="print-head"><h2>${esc(b.title)}</h2><p>${esc(rDesc(b.c))}</p><p>Gerado em ${fdate(today())}</p></div>
 ${hasData?'':'<div class="note">Banco de dados vazio: os relatórios aparecem zerados até haver lançamentos.</div>'}
 ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
 <div class="note">${u.mode==='total'?'Valores <b>realizados</b> e <b>previstos</b> aparecem separados. Previsto = pendente ou ainda não ocorrido; nunca é tratado como pago.':u.mode==='real'?'Exibindo somente valores realizados (pagos/recebidos/já ocorridos).':'Exibindo somente valores previstos (pendentes/futuros).'}</div>
 <div class="kpis">${kp}</div>
 ${r.charts.length?`<div class="two">${r.charts.map(([t,svg,lg])=>`<div class="card"><h3>${esc(t)}</h3>${svg}${lg}</div>`).join('')}</div>`:''}
 <div class="card">${r.sections.map(r5Table).join('')}</div>`;
}
VIEW.relat=viewRelat;
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||!/^r5/.test(el.dataset.act))return;const u=S.ui5,D=el.dataset;

/* ===== Execução segura de ações (sem reentrada, com tratamento de erro) ===== */
let busy=false;
async function act(fn){
 if(busy)return;
 busy=true;
 try{await fn()}catch(e){console.error(e);toast('Erro: '+(quotaMsg(e)||'falha na operação'))}
 finally{busy=false}
}

/* ===== Lançamento rápido ===== */
function fillCats(){const k=$('#f').elements.type.value;$('#f').elements.categoryId.innerHTML=S.cats.filter(c=>c.kind===k).map(c=>`<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('')}
$('#f').addEventListener('change',e=>{if(e.target.name==='type')fillCats()});
$('#f').addEventListener('submit',e=>{e.preventDefault();const f=e.target;act(async()=>{
 const a=money(f.elements.amount.value),date=f.elements.date.value;
 if(!(a>0)){toast('Informe um valor maior que zero');return}
 if(!RXD.test(date)){toast('Informe uma data válida');return}
 const pago=f.elements.status.value==='pago';
 const eid=f.elements.id.value,old=eid&&S.tx.find(x=>x.id===eid);
 if(eid&&(!old||!isCommon(old)))throw new Error('Este lançamento não pode ser editado aqui');
 const rec={...(old||{id:uid(),accountId:S.accts[0]?.id||'acc_main'}),type:f.elements.type.value,description:f.elements.description.value.trim(),amount:a,date,dueDate:date,categoryId:f.elements.categoryId.value,status:f.elements.status.value};
 if(pago)rec.paidDate=date;else delete rec.paidDate;
 await DB.put('transactions',rec);
 $('#dlg').close();await load();render();toast(old?'Lançamento atualizado':'Lançamento salvo');
})});

/* ===== Eventos ===== */
const side=()=>{$('#side').classList.toggle('open');$('#ov').classList.toggle('on')};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 switch(a){
  case 'go':S.page=id;location.hash=id;if($('#side').classList.contains('open'))side();render();scrollTo(0,0);break;
  case 'menu':side();break;
  case 'prev':S.month=shiftMonth(S.month,-1);render();break;
  case 'next':S.month=shiftMonth(S.month,1);render();break;
  case 'today':S.month=today().slice(0,7);render();break;
  case 'editTx':{const t=S.tx.find(x=>x.id===id);if(!t||!isCommon(t))return toast('Este lançamento não pode ser editado aqui');const f=$('#f');f.reset();f.elements.id.value=t.id;$('#dlgTitle').textContent='Editar lançamento';const E=f.elements;E.type.value=t.type;fillCats();E.description.value=t.description;E.amount.value=t.amount;E.date.value=t.date;E.categoryId.value=t.categoryId;E.status.value=t.status;$('#dlg').showModal();break}
  case 'add':{const f=$('#f');f.reset();f.elements.id.value='';$('#dlgTitle').textContent='Novo lançamento';f.elements.date.value=today();fillCats();$('#dlg').showModal();f.elements.description.focus();break}
  case 'close':$('#dlg').close();break;
  case 'theme':act(async()=>{const s={...S.settings,theme:S.settings.theme==='dark'?'light':'dark'};await DB.put('settings',s);S.settings=s;render()});break;
  case 'pay':act(()=>markPaid(id));break;
  case 'del':if(confirm(delMsg(id)))act(()=>deleteTx(id));break;
  case 'saveCfg':act(async()=>{
   const raw=$('#cfgSaldo').value.trim(),saldo=raw===''?0:Number(raw);
   if(!Number.isFinite(saldo)){toast('Saldo inicial inválido');return}
   const base=S.accts[0]||{id:'acc_main',name:'Conta principal'},name=$('#cfgName').value.trim()||'Minhas Finanças';
   await DB.run(['settings','accounts'],'readwrite',s=>{s.settings.put({...S.settings,id:'main',name});s.accounts.put({...base,saldoInicial:money(saldo),demoSaldo:false})});
   await load();render();toast('Configurações salvas');
  });break;
  case 'export':act(exportZip);break;
  case 'import':$('#file').click();break;
  case 'csv':exportCSV();break;
  case 'demo':act(loadDemo);break;
  case 'undemo':act(unDemo);break;
  case 'wipe':if(confirm('Apagar TODOS os dados deste navegador? Esta ação não pode ser desfeita.'))act(async()=>{
   await DB.run(DB.ST,'readwrite',s=>{DB.ST.forEach(n=>s[n].clear())});
   S.settings={};await load();await seed();render();toast('Dados apagados');
  });break;
 }
});

})();
