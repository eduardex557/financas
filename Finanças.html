<!DOCTYPE html>
<!-- ESTADO DO PROJETO: Etapa 1 concluída (dashboard, IndexedDB, backup/CSV). Etapa 2 concluída (cartões, compras/parcelas, faturas, pagamentos, limite, integração com dashboard).
     Etapa 3A concluída (produtos parcelados fora do cartão: parcelas, pagamento, antecipação com desconto, quitação, cancelamento, integração com saldo e dashboard).
     Etapa 3B concluída (financiamentos e empréstimos: cadastro, cronograma SAC/PRICE estimado, pagamentos, atualização de saldo, amortização extraordinária, integração com saldo e dashboard).
     Correções pós-Etapa 4: estorno de amortização, recálculo após pagamento, limpeza de anexos da demo, edição de lançamentos comuns.
     Etapa 4 concluída (comprovantes/documentos em todos os registros, visualização/download/substituição, painel de armazenamento, backup completo em ZIP com restauração atômica).
     Pendente: fluxo de caixa detalhado, contas/despesas fixas (a combinar) e Etapa 5 (relatórios). Schema v6, banco IndexedDB v3 (stores inalteradas; 'attachments' ganha ownerType/ownerId/hash/docType...).
 Etapa 5A concluída (Relatórios: filtros combináveis, 5 abas rd/fc/ct/pf/cg, gráficos SVG, CSV e impressão; reutiliza ctx/aggregate(X,keep)/cardStats/prodStats/loanState/s3Report; não altera registros). Próxima: Etapa 5B (NÃO iniciada).
 Etapa 5B concluída (auditoria: projeção do fluxo de caixa alinhada ao dashboard; erro de armazenamento cheio amigável em todas as ações; gráficos em 1 coluna no celular). Projeto completo; sem etapa pendente. Validado só em jsdom — recomenda-se uso real com backup .zip regular. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanças Pessoais</title>
<style>
:root{--bg:#eef2fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e8ecf4;--soft:#f3f5fa;--pri:#2563eb;--pri2:#1e3a8a;--ok:#16a34a;--bad:#e11d48;--warn:#f59e0b;--sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05)}
[data-theme=dark]{--bg:#0b1120;--card:#131c31;--ink:#e8edf7;--mut:#8b9ab5;--line:#223050;--soft:#1a2540;--sh:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.brand b{display:block;font-size:15px}.brand span{font-size:12px;color:var(--mut)}
.lbl{font-size:11px;color:var(--mut);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--mut);cursor:pointer;font-weight:500;user-select:none}
.nav a:hover{background:var(--soft)}.nav a.on{background:var(--soft);color:var(--ink);font-weight:600}
.nav a.on svg{color:var(--pri)}
.sp{flex:1}
.sfoot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--mut)}
.content{padding:18px 24px 40px;min-width:0}
.top{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:10px 14px;margin-bottom:16px;position:sticky;top:10px;z-index:20}
.top h1{font-size:20px;font-weight:600;cursor:pointer}.top h1 span{color:var(--mut);font-weight:400}
.ib{border:0;background:transparent;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.ib:hover{background:var(--soft)}
.burger{display:none}
.btn{border:0;background:var(--pri);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:18px;min-width:0}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:400;color:var(--mut)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{position:relative;padding:16px}.kpi .l{color:var(--mut);font-size:12.5px}.kpi .v{font-size:22px;font-weight:700;margin:4px 0 2px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--mut)}.kpi .e{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft)}
.big{font-weight:700;letter-spacing:-.03em;font-size:46px}.big small{font-size:.5em;color:var(--mut);font-weight:600}.big sub{font-size:.45em;color:var(--mut);vertical-align:baseline;font-weight:500}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}.hero .ill{font-size:56px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18))}
.hint{color:var(--mut);font-size:12.5px}
.seg{display:flex;height:9px;border-radius:9px;overflow:hidden;background:var(--soft);margin:16px 0 10px;gap:2px}
.seg i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12.5px;color:var(--mut)}
.legend b{color:var(--ink);display:block;font-size:13.5px}.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .d{flex:1;min-width:0}.row .d b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .d span{font-size:12px;color:var(--mut)}
.row .a{font-weight:600;white-space:nowrap}
.em{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}
.chk{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--mut);background:transparent;cursor:pointer;flex:none}.chk:hover{border-color:var(--ok);background:rgba(22,163,74,.15)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.ok{background:rgba(22,163,74,.12);color:var(--ok)}.tag.w{background:rgba(245,158,11,.15);color:#b45309}.tag.b{background:rgba(225,29,72,.12);color:var(--bad)}
.x{opacity:0;border:0;background:none;color:var(--mut);cursor:pointer}.row:hover .x{opacity:1}.x:hover{color:var(--bad)}@media(hover:none){.x{opacity:1}}
.chart{width:100%;height:auto;display:block}.gl{stroke:var(--line);stroke-width:1}.ax{fill:var(--mut);font-size:11px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donut ul{list-style:none;padding:0;flex:1;min-width:150px;font-size:12.5px}
.donut li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.donut li span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.empty{text-align:center;color:var(--mut);padding:22px 8px;font-size:13px}
.banner{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner .btn{background:#fff;color:var(--pri2)}.banner .btn.sec{background:rgba(255,255,255,.18);color:#fff;border:0}
.warn{background:rgba(245,158,11,.14);color:#b45309;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px}
.ph{text-align:center;padding:60px 20px}.ph .big-e{font-size:54px}.ph h2{margin:10px 0 6px}.ph p{color:var(--mut);max-width:520px;margin:0 auto 14px}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12.5px;color:var(--mut)}
.fld input,.fld select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
dialog{border:0;border-radius:18px;padding:22px;width:min(420px,92vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,23,42,.5)}
.pills{display:flex;gap:6px;margin-bottom:14px}.pills label{flex:1;text-align:center;padding:9px;border-radius:10px;background:var(--soft);cursor:pointer;font-weight:600;color:var(--mut)}
.pills input{display:none}.pills input:checked+span{color:#fff}.pills label:has(input:checked){background:var(--pri);color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;font-size:13px}
.ov{display:none}
.ctile{border-radius:16px;padding:16px;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:170px;box-shadow:var(--sh)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pbar{height:7px;border-radius:7px;background:var(--soft);overflow:hidden}.pbar i{display:block;height:100%;background:var(--pri)}
.lnk{cursor:pointer}.lnk:hover{background:var(--soft)}
dialog.wide{width:min(620px,94vw);max-height:90vh}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}.tbl th{text-align:left;font-weight:600;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td.n,.tbl th.n{text-align:right}.tbl tr.paid td{color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs .btn{padding:7px 14px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--mut);margin:10px 0}
.alert{background:rgba(245,158,11,.14);color:#b45309;border-radius:12px;padding:9px 12px;font-size:12.5px;margin:6px 0}
.alert.bad{background:rgba(225,29,72,.12);color:var(--bad)}
.tag.est{background:rgba(124,58,237,.12);color:#7c3aed}
.dtitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.2s;width:260px}.side.open{transform:none}
 .ov.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}.burger{display:grid}
 .content{padding:10px 12px 40px}.two{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.big{font-size:36px}.hero .ill{font-size:40px}.btn span.t{display:none}
}
@media(max-width:480px){.kpis{grid-template-columns:1fr}}

.print-head{display:none}
@media print{.side,.top,.no-print,.toast,.warn{display:none!important}.app{display:block}.content{padding:0!important}body{background:#fff}.card{box-shadow:none!important;break-inside:avoid;border:1px solid #ddd}.print-head{display:block;margin-bottom:10px}.tbl td,.tbl th{white-space:normal}.two{display:block}}
</style>
</head>
<body>
<div class="app">
 <aside class="side" id="side"></aside>
 <div class="ov" id="ov" data-act="menu"></div>
 <main class="content">
  <div class="top">
   <button class="ib burger" data-act="menu" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
   <button class="ib" data-act="prev" aria-label="Mês anterior"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
   <button class="ib" data-act="next" aria-label="Próximo mês"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
   <h1 id="mlabel" data-act="today" title="Voltar ao mês atual"></h1>
   <div class="sp"></div>
   <button class="btn" data-act="add">+ <span class="t">Adicionar</span></button>
  </div>
  <div id="view"></div>
 </main>
</div>

<dialog id="dlg">
 <form id="f">
  <input type="hidden" name="id" value="">
  <h3 id="dlgTitle" style="font-size:17px;margin-bottom:14px">Novo lançamento</h3>
  <div class="pills">
   <label><input type="radio" name="type" value="despesa" checked><span>Despesa</span></label>
   <label><input type="radio" name="type" value="receita"><span>Receita</span></label>
  </div>
  <label class="fld">Descrição<input name="description" required maxlength="80"></label>
  <label class="fld">Valor (R$)<input name="amount" type="number" step="0.01" min="0.01" required inputmode="decimal"></label>
  <label class="fld">Data<input name="date" type="date" required></label>
  <label class="fld">Categoria<select name="categoryId"></select></label>
  <label class="fld">Situação<select name="status"><option value="pago">Pago / recebido</option><option value="pendente">Pendente</option></select></label>
  <div class="btns" style="justify-content:flex-end"><button type="button" class="btn sec" data-act="close">Cancelar</button><button class="btn">Salvar</button></div>
 </form>
</dialog>
<dialog id="dlgCard"><form id="fCard"><h3 id="cardTitle" style="font-size:17px;margin-bottom:14px">Novo cartão</h3>
 <input type="hidden" name="cid">
 <label class="fld">Nome do cartão<input name="cname" required maxlength="40"></label>
 <div class="two"><label class="fld">Banco<input name="bank" maxlength="40"></label><label class="fld">Bandeira<select name="brand"></select></label>
 <label class="fld">Últimos 4 dígitos<input name="last4" maxlength="4" inputmode="numeric"></label><label class="fld">Limite total (R$)<input name="limit" type="number" step="0.01" min="0" required></label>
 <label class="fld">Dia de fechamento<input name="closeDay" type="number" min="1" max="31" required></label><label class="fld">Dia de vencimento<input name="dueDay" type="number" min="1" max="31" required></label>
 <label class="fld">Cor<input name="color" type="color"></label><label class="fld">Situação<select name="active"><option value="1">Ativo</option><option value="0">Inativo</option></select></label></div>
 <label class="fld">Compra no dia do fechamento entra na<select name="closeSame"><option value="atual">Fatura que fecha (atual)</option><option value="proxima">Próxima fatura</option></select></label>
 <div class="btns" style="justify-content:flex-end"><button type="button" class="btn sec" data-act="x-close">Cancelar</button><button class="btn">Salvar</button></div></form></dialog>
<dialog id="dlgBuy"><form id="fBuy"><h3 id="buyTitle" style="font-size:17px;margin-bottom:14px">Nova compra no cartão</h3>
 <input type="hidden" name="bid">
 <label class="fld">Cartão<select name="bcard"></select></label>
 <label class="fld">Descrição<input name="bdesc" required maxlength="80"></label>
 <div class="two"><label class="fld">Categoria<select name="bcat"></select></label><label class="fld">Estabelecimento (opcional)<input name="bmer" maxlength="60"></label>
 <label class="fld">Data da compra<input name="bdate" type="date" required></label><label class="fld">Valor total (R$)<input name="btotal" type="number" step="0.01" min="0.01" required inputmode="decimal"></label></div>
 <label class="fld">Parcelas<input name="bparc" type="number" min="1" max="48" value="1" required></label>
 <label class="fld">Observações (opcional)<input name="bnotes" maxlength="200"></label>
 <div id="buyPrev" class="hint" style="margin-bottom:12px"></div>
 <div class="btns" style="justify-content:flex-end"><button type="button" class="btn sec" data-act="x-close">Cancelar</button><button class="btn">Salvar</button></div></form></dialog>
<dialog id="dlgPay"><form id="fPay"><h3 style="font-size:17px;margin-bottom:6px">Pagar fatura</h3><div id="payInfo" class="hint" style="margin-bottom:12px"></div>
 <input type="hidden" name="pcard"><input type="hidden" name="pmonth">
 <label class="fld">Valor (R$) — integral ou parcial<input name="pamount" type="number" step="0.01" min="0.01" required></label>
 <label class="fld">Data do pagamento<input name="pdate" type="date" required></label>
 <label class="fld">Conta utilizada<select name="pacc"></select></label>
 <label class="fld">Observações (opcional)<input name="pnotes" maxlength="200"></label>
 <label class="fld" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="pagend" style="width:auto"> Agendar (não dar baixa agora; data futura agenda automaticamente)</label>
 <div class="btns" style="justify-content:flex-end"><button type="button" class="btn sec" data-act="x-close">Cancelar</button><button class="btn">Confirmar pagamento</button></div></form></dialog>
<dialog id="dlgInv" class="wide"><div id="invBody"></div></dialog>
<dialog id="dlgV" class="wide"><div id="vBody"></div></dialog>
<dialog id="dlgE" class="wide"><div id="eBody"></div></dialog>
<input type="file" id="file" accept=".zip,.json,application/zip,application/json" hidden>
<input type="file" id="docRep" accept=".pdf,.jpg,.jpeg,.png,.webp" hidden>
<dialog id="dlgDocs" class="wide"><div id="docsBody"></div></dialog>
<dialog id="dlgPrev" class="wide" style="width:min(900px,96vw)"><div id="prevBody"></div></dialog>

<script>
/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const fdate=s=>s?s.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
/* Precisão monetária: tudo é arredondado a centavos; somas são feitas em centavos inteiros. */
const money=v=>Math.round((Number(v)||0)*100)/100+0;
const cents=v=>Math.round((Number(v)||0)*100);
const sum=(a,f=t=>t.amount)=>money(a.reduce((s,t)=>s+cents(f(t)),0)/100);
const brl=v=>nf.format(money(v)).replace(/ /g,' ');
const big=v=>{const [i,c]=Math.abs(v).toFixed(2).split('.');return `<span class="big"><small>${v<0?'−R$':'R$'}</small> ${i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}<sub>,${c}</sub></span>`};
const ymOf=s=>String(s||'').slice(0,7);
const shiftMonth=(key,n)=>{const [y,m]=key.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const monthsBack=(key,n)=>Array.from({length:n},(_,i)=>shiftMonth(key,i-n+1));
const mShort=k=>MESES[+k.slice(5)-1].slice(0,3);
const IC={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',flow:'<path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',bank:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',clip:'<path d="M21 11l-9 9a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>'};
const icon=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};

/* ===== Camada de dados (IndexedDB com fallback em memória) =====
 DB.run(stores, mode, fn): uma única transação (atômica) sobre uma ou várias stores.
  - stores string  -> fn recebe a store;  stores array -> fn recebe {nome: store}.
  - fn pode retornar uma requisição (ou array de requisições); o resultado é entregue ao concluir a transação.
  - qualquer exceção ou abort desfaz tudo e rejeita a promessa. */
const SCHEMA=6;
const DB=(()=>{
 const ST=['settings','accounts','categories','transactions','cards','installments','financings','attachments','attachmentBlobs','products'];
 let db,mem=null;
 const toMem=()=>{mem=Object.fromEntries(ST.map(s=>[s,new Map()]))};
 const isReq=o=>!!o&&typeof o==='object'&&'onsuccess' in o;
 const unwrap=o=>isReq(o)?o.result:Array.isArray(o)?o.map(unwrap):o;
 const req=r=>({result:r,set onsuccess(f){f()}});
 const facade=n=>{const m=mem[n];return{
  put:o=>{if(!o||(typeof o.id!=='string'&&typeof o.id!=='number'))throw new Error('Registro sem id');m.set(o.id,{...o})},
  delete:id=>{m.delete(id)},clear:()=>{m.clear()},
  getAll:()=>req([...m.values()].map(x=>({...x}))),get:id=>req(m.has(id)?{...m.get(id)}:undefined),count:()=>req(m.size)}};
 const run=(stores,mode,fn)=>new Promise((res,rej)=>{
  const names=[].concat(stores),single=typeof stores==='string';
  if(mem){
   const snap=names.map(n=>[n,new Map(mem[n])]);
   try{const f=Object.fromEntries(names.map(n=>[n,facade(n)]));res(unwrap(fn(single?f[names[0]]:f)))}
   catch(e){snap.forEach(([n,m])=>{mem[n]=m});rej(e)}
   return;
  }
  let t,out;
  try{
   t=db.transaction(names,mode);
   const o=Object.fromEntries(names.map(n=>[n,t.objectStore(n)]));
   out=fn(single?o[names[0]]:o);
  }catch(e){try{t&&t.abort()}catch(_){}return rej(e)}
  t.oncomplete=()=>res(unwrap(out));
  t.onabort=()=>rej(t.error||new Error('Transação abortada'));
 });
 return{ST,run,
  open:()=>new Promise(res=>{try{const r=indexedDB.open('financas-pessoais',3);
   r.onupgradeneeded=()=>ST.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});
   r.onsuccess=()=>{db=r.result;db.onversionchange=()=>db.close();res(true)};
   r.onerror=r.onblocked=()=>{toMem();res(false)}}catch(e){toMem();res(false)}}),
  all:s=>run(s,'readonly',st=>st.getAll()),
  count:s=>run(s,'readonly',st=>st.count()),
  put:(s,o)=>run(s,'readwrite',st=>{st.put(o)}),
  putMany:(s,a)=>run(s,'readwrite',st=>{a.forEach(o=>st.put(o))}),
  del:(s,id)=>run(s,'readwrite',st=>{st.delete(id)}),
  clear:s=>run(s,'readwrite',st=>{st.clear()}),
  get persistent(){return !mem}};
})();

/* Esquemas (documentação para as próximas etapas):
 transactions {id,type:'receita'|'despesa'|'transferencia'|'pagamento_fatura',description,amount,
   date (competência), dueDate? (vencimento), paidDate? (pagamento efetivo), status:'pago'|'pendente',
   accountId (origem), toAccountId? (destino, só em transferência), categoryId,
   cardId?, invoiceMonth? ('YYYY-MM' do fechamento do ciclo; em pagamento_fatura = ciclo quitado),
   invoicePaymentId? (pagamento_fatura que baixou este item), installmentGroupId?, financingId?, attachmentIds?[], demo?}
 accounts {id,name,saldoInicial} · categories {id,name,kind,emoji,color}
 cards {id,name,limit,closeDay,dueDay} · installments {id,description,total,parcels,firstDate,cardId}
 financings {id,name,total,parcels,paidParcels,parcela,saldoDevedor}
 attachments (só metadados) {id,txId,name,mime,size,createdAt} · attachmentBlobs {id (= id do anexo), blob: Blob}
 ETAPA 4 — attachments {id,ownerType:'tx'|'product'|'loan',ownerId,txId?,name,mime,size,hash,docType,description,notes,categoryId,recordLabel,ownerKind,createdAt,replacedAt?,history?[]}; attachmentBlobs {id,blob}; settings.maxFileMB
 ETAPA 3B — financings (v:2) {id,name,institution,kind,contractDate,principal,received,downPayment,rate,rateType,system:'SAC'|'PRICE'|'OUTRO'|'NI',n,nOriginal,firstInstallment,firstDue,dueDay,insurance,fees,
   paidBefore,baseline{balance,date,paidCount,source:'contrato'|'extrato'|'estimado',seq},accountId,status:'ativo'|'quitado'|'cancelado',log[]; + legados total,parcels,paidParcels,parcela,saldoDevedor (instantâneo)}
   transactions +: loanId, kind 'prestacao'|'amortizacao', estimated, principal, interest, fees, balanceAfter, estimatedAmount, splitSource, amortMode, applied, before, after; type 'amortizacao' (saída financeira, não é despesa)
 ETAPA 3A — products {id,name,categoryId,merchant,purchaseDate,total,down,financed,n,mode,payMethod,rate,rateType,firstDue,dueDay,accountId,notes,
   installmentsTotal,interestTotal,impliedRate,status:'ativo'|'cancelado',canceledParcels?,log[],attachmentIds[]}
   transactions +: productId, kind ('entrada'|'parcela'), parcelNumber, parcelCount, originalAmount, adjustment, paySeq, payKind, payNotes */

const S={settings:{},accts:[],cats:[],tx:[],cards:[],inst:[],fin:[],prod:[],att:[],ui4:{},ui3:{prodTab:'ativo',loanTab:'ativo',ltab:'resumo',vk:'p',view:null,lview:null},attN:0,month:today().slice(0,7),page:'home'};

const REC_CATS=[['Salário','💼','#16a34a'],['Rendimentos','📈','#22c55e'],['Outras receitas','💵','#84cc16']];
const defaultCats=()=>[...DEFAULT_CATS.map(c=>['despesa',c]),...REC_CATS.map(c=>['receita',c])].map(([k,c])=>({id:'cat_'+c[0].toLowerCase().normalize('NFD').replace(/[^a-z]/g,''),name:c[0],kind:k,emoji:c[1],color:c[2]}));

/* Anexos ficam fora da RAM: load() só conta os metadados; blobs só são lidos sob demanda. */
async function load(){
 const [st,ac,ca,tx,cd,is,fi,an,pr]=await DB.run(['settings','accounts','categories','transactions','cards','installments','financings','attachments','products'],'readonly',s=>[s.settings.getAll(),s.accounts.getAll(),s.categories.getAll(),s.transactions.getAll(),s.cards.getAll(),s.installments.getAll(),s.financings.getAll(),s.attachments.getAll(),s.products.getAll()]);
 S.settings=st.find(x=>x.id==='main')||{};S.accts=ac;S.cats=ca;S.tx=tx;S.cards=cd;S.inst=is;S.fin=fi;S.att=an;S.attN=an.length;S.prod=pr;
}

async function migrate(){
 if((S.settings.schemaVersion||1)>=SCHEMA)return;
 const cm=new Map(S.cards.map(c=>[c.id,c]));
 const fix=S.tx.filter(t=>t.cardId&&t.type==='despesa'&&!t.invoiceMonth).map(t=>({...t,invoiceMonth:invoiceMonthOf(cm.get(t.cardId),t.date)}));
 const fin=S.fin.filter(f=>f.v!==2).map(upgradeFinancing);
 const att=S.att.filter(a=>!a.ownerType&&a.txId).map(a=>({...a,ownerType:'tx',ownerId:a.txId}));
 await DB.run(['transactions','settings','cards','financings','attachments'],'readwrite',s=>{att.forEach(a=>s.attachments.put(a));fix.forEach(t=>s.transactions.put(t));S.cards.forEach(c=>s.cards.put({active:true,closeSame:'atual',color:'#2563eb',limitMode:'pagamento',...c}));fin.forEach(f=>s.financings.put(f));s.settings.put({...S.settings,schemaVersion:SCHEMA})});

const catOf=id=>S.cats.find(c=>c.id===id)||{name:'Sem categoria',emoji:'📦',color:'#94a3b8'};
const accName=id=>S.accts.find(a=>a.id===id)?.name||'Conta';

/* ===== Faturas de cartão =====
 invoiceMonth = mês do FECHAMENTO do ciclo. Compra após o dia de fechamento entra no ciclo seguinte.
 Vencimento: no mesmo mês do fechamento se dueDay > closeDay; senão, no mês seguinte. */
const dim=(y,m)=>new Date(y,m,0).getDate();
function invoiceMonthOf(card,date){
 const [y,m,d]=String(date).split('-').map(Number),k=`${y}-${pad(m)}`;
 if(!card||!card.closeDay)return k;
 const cl=Math.min(card.closeDay,dim(y,m));return (card.closeSame==='proxima'?d>=cl:d>cl)?shiftMonth(k,1):k;
}
function invoiceDue(card,month){
 let k=month;
 if(card&&card.dueDay&&card.closeDay&&card.dueDay<=card.closeDay)k=shiftMonth(month,1);
 const [yy,mm]=k.split('-').map(Number),n=dim(yy,mm);
 return `${k}-${pad(Math.min((card&&card.dueDay)||n,n))}`;
}
/* Contexto de cálculo: consolida faturas e classifica lançamentos (uma vez por renderização). */
function ctx(){
 const td=today(),cm=new Map(S.cards.map(c=>[c.id,c])),inv=new Map(),loose=[];
 const ref=t=>t.cardId?(t.invoiceMonth||invoiceMonthOf(cm.get(t.cardId),t.date)):ymOf(t.date);
 const get=(c,m)=>{const k=c+'|'+m;let o=inv.get(k);if(!o){o={cardId:c,month:m,ch:0,pd:0,sc:0,due:invoiceDue(cm.get(c),m)};inv.set(k,o)}return o};
 S.tx.forEach(t=>{
  if(!t.cardId)return;
  const c=cents(t.amount);
  if(t.type==='despesa')get(t.cardId,ref(t)).ch+=c;
  else if(t.type==='pagamento_fatura'){
   if(t.invoiceMonth)get(t.cardId,t.invoiceMonth)[t.status==='pago'?'pd':'sc']+=c;
   else loose.push(t);
  }
 });
 /* pagamento sem ciclo informado: abate do ciclo mais antigo para o mais novo (nunca conta em dobro) */
 loose.sort((a,b)=>String(a.date).localeCompare(b.date)).forEach(t=>{
  let rest=cents(t.amount);
  [...inv.values()].filter(o=>o.cardId===t.cardId).sort((a,b)=>a.month.localeCompare(b.month)).forEach(o=>{
   const take=Math.min(rest,Math.max(0,o.ch-o.pd-o.sc));o[t.status==='pago'?'pd':'sc']+=take;rest-=take;
  });
 });
 inv.forEach(o=>{o.charges=o.ch/100;o.paid=o.pd/100;o.scheduled=o.sc/100;o.open=Math.max(0,o.ch-o.pd)/100;o.uncovered=Math.max(0,o.ch-o.pd-o.sc)/100});
 const paid=t=>{
  if(t.status==='pago')return true;
  if(t.cardId&&t.type==='despesa'){const o=inv.get(t.cardId+'|'+ref(t));return !!o&&o.pd>0&&o.ch-o.pd<=0}
  return false;
 };
 const real=t=>paid(t)||(!!t.cardId&&t.date<=td);
 return{td,inv,ref,paid,real};
}

/* ===== Regras financeiras =====
 - Compra no cartão = despesa de consumo na data da compra; NÃO mexe no caixa.
 - Caixa só muda por receita, despesa fora do cartão, pagamento de fatura e transferência.
 - Fatura em aberto = compras do ciclo − pagamentos do ciclo (pagos); nunca depende de os itens terem sido baixados.
 - Pagamento de fatura e transferência NÃO são consumo: ficam fora de receitas/despesas do mês.
 - Data de caixa: pago => paidDate||date; pendente => dueDate||date.
 - Realizada = paga, ou compra no cartão já ocorrida. Prevista = demais. */
function calc(month,X=ctx()){
 const td=X.td,end=month+'-31',inM=t=>ymOf(t.date)===month;
 const bal=new Map(S.accts.map(a=>[a.id,cents(a.saldoInicial)]));
 if(!bal.size)bal.set('acc_main',0);
 const first=bal.keys().next().value,key=id=>bal.has(id)?id:first;
 let proj=[...bal.values()].reduce((s,v)=>s+v,0);
 S.tx.forEach(t=>{
  const c=cents(t.amount),done=t.status==='pago',ed=done?(t.paidDate||t.date):(t.dueDate||t.date),now=done&&ed<=td;
  if(t.type==='transferencia'){
   if(!bal.has(t.accountId)||!bal.has(t.toAccountId)||t.accountId===t.toAccountId)return;
   if(now){bal.set(t.accountId,bal.get(t.accountId)-c);bal.set(t.toAccountId,bal.get(t.toAccountId)+c)}
   return; /* transferência não altera o total nem entra em receitas/despesas */
  }
  let d=0;
  if(t.type==='receita')d=c;
  else if(t.type==='despesa'&&!t.cardId)d=-c;
  else if(t.type==='pagamento_fatura')d=-c;
  else if(t.type==='amortizacao')d=-c; /* saída financeira: reduz o caixa, não é despesa de consumo */
  if(!d)return;
  if(now){const a=key(t.accountId);bal.set(a,bal.get(a)+d)}
  if(ed<=end)proj+=d;
 });
 let faturas=0;const cmx=new Map(S.cards.map(c=>[c.id,c]));
 X.inv.forEach(o=>{const cc=cmx.get(o.cardId),cur=cc?invoiceMonthOf(cc,td):o.month;
  if(o.month<=cur)faturas+=cents(o.open); /* ciclos futuros já aparecem em "Parcelas futuras" */
  if(o.month<=month&&o.uncovered>0)proj-=cents(o.uncovered); /* inclui fatura do próprio mês que vence no mês seguinte */
 });
 const rec=S.tx.filter(t=>t.type==='receita'&&inM(t)),des=S.tx.filter(t=>t.type==='despesa'&&inM(t));
 const desTotal=sum(des),desPagas=sum(des.filter(X.paid));
 return{
  saldo:money([...bal.values()].reduce((s,v)=>s+v,0)/100),
  contas:S.accts.map(a=>({id:a.id,name:a.name,saldo:money(bal.get(a.id)/100)})),
  previsto:money(proj/100),
  recTotal:sum(rec),recReal:sum(rec.filter(t=>t.status==='pago')),
  desTotal,desPagas,desPend:money(desTotal-desPagas),
  desReal:sum(des.filter(X.real)),desPrev:sum(des.filter(t=>!X.real(t))),
  faturas:money(faturas/100),
  futuras:sum(S.tx.filter(t=>t.type==='despesa'&&t.installmentGroupId&&!X.paid(t)&&X.ref(t)>month)),
  fin:sum(S.fin.filter(f=>f.status!=='cancelado'),f=>f.saldoDevedor),des};
}
/* Agregado mensal por competência, separando realizado (r,d) de previsto (rp,dp). */
function aggregate(X=ctx(),keep=null){
 const m={};
 S.tx.forEach(t=>{
  if(t.type!=='receita'&&t.type!=='despesa')return;
  if(keep&&!keep(t))return;
  const k=ymOf(t.date),o=m[k]||(m[k]={r:0,rp:0,d:0,dp:0});
  const real=t.type==='receita'?t.status==='pago':X.real(t);
  o[(t.type==='receita'?'r':'d')+(real?'':'p')]+=cents(t.amount);
 });
 Object.values(m).forEach(o=>{for(const k in o)o[k]=o[k]/100});
 return m;
}

/* ===== Operações de dados ===== */
/* Baixa um item pendente. Pagamento de fatura que quita o ciclo baixa/vincula os itens do ciclo. */
async function markPaid(id){
 const t=S.tx.find(x=>x.id===id);
 if(!t||t.status==='pago')return;
 if(t.productId||t.loanId){await quickPay(t);render();toast('Pagamento registrado');return}
 const d=today(),upd=[{...t,status:'pago',paidDate:d}];
 if(t.type==='pagamento_fatura'&&t.cardId&&t.invoiceMonth){
  const X=ctx(),o=X.inv.get(t.cardId+'|'+t.invoiceMonth);
  if(o&&cents(o.paid)+cents(t.amount)>=cents(o.charges))
   S.tx.filter(x=>x.type==='despesa'&&x.cardId===t.cardId&&X.ref(x)===t.invoiceMonth&&x.status!=='pago').forEach(x=>upd.push({...x,invoiceMonth:t.invoiceMonth,status:'pago',paidDate:d,invoicePaymentId:t.id}));
 }
 await DB.putMany('transactions',upd);
 await load();render();toast('Marcado como pago');
}
/* Exclusão com limpeza de referências na MESMA transação. */
async function deleteTx(id){
 const t=S.tx.find(x=>x.id===id);
 if(!t)return;
 if(t.productId||t.loanId||t.type==='amortizacao')throw new Error('Gerencie este lançamento em Produtos parcelados ou Financiamentos (estorno/cancelamento preservam o histórico).');
 if(t.type==='despesa'&&t.cardId){await delPurchase(t.installmentGroupId||t.id);render();return}
 const unlink=t.type==='pagamento_fatura'?S.tx.filter(x=>x.invoicePaymentId===id||(t.invoiceMonth&&x.invoicePaymentId&&x.type==='despesa'&&x.cardId===t.cardId&&x.invoiceMonth===t.invoiceMonth)).map(x=>{const {invoicePaymentId,paidDate,...r}=x;return{...r,status:'pendente'}}):[];
 const lastOfGroup=t.installmentGroupId&&!S.tx.some(x=>x.id!==id&&x.installmentGroupId===t.installmentGroupId);
 await DB.run(['transactions','installments','attachments','attachmentBlobs'],'readwrite',s=>{
  s.transactions.delete(id);
  unlink.forEach(x=>s.transactions.put(x));
  if(lastOfGroup)s.installments.delete(t.installmentGroupId);
  (t.attachmentIds||[]).forEach(a=>{s.attachments.delete(a);s.attachmentBlobs.delete(a)});
  const rq=s.attachments.getAll();
  rq.onsuccess=()=>rq.result.filter(a=>a.txId===id).forEach(a=>{s.attachments.delete(a.id);s.attachmentBlobs.delete(a.id)});
 });
 await load();render();
}
/* Prontos para a Etapa 2/3 (sem interface ainda). */
function buildInvoicePayment(card,month,items,o={}){
 const cs=items.filter(t=>t.type==='despesa'&&t.cardId===card.id&&(t.invoiceMonth||invoiceMonthOf(card,t.date))===month);
 const charges=sum(cs),amount=money(o.amount??charges),id=o.id||uid(),date=o.date||today();
 const pay={id,type:'pagamento_fatura',description:`Fatura ${card.name}`,amount,date,dueDate:o.schedule?date:invoiceDue(card,month),...(o.schedule?{}:{paidDate:date}),status:o.schedule?'pendente':'pago',accountId:o.accountId,categoryId:o.categoryId,cardId:card.id,invoiceMonth:month,notes:o.notes||''};
 const linked=!o.schedule&&money((o.paidBefore||0)+amount)>=charges?cs.filter(t=>t.status!=='pago').map(t=>({...t,invoiceMonth:month,status:'pago',paidDate:date,invoicePaymentId:id})):[];
 return{pay,linked};
}
async function payInvoice(cardId,month,o={}){
 const card=S.cards.find(c=>c.id===cardId);
 if(!card)throw new Error('Cartão não encontrado');
 const inv=ctx().inv.get(cardId+'|'+month);
 if(!inv||!(inv.open>0))throw new Error('Fatura sem saldo em aberto');
 const amt=o.amount===undefined?inv.uncovered:money(o.amount);
 if(!(cents(amt)>0))throw new Error('Valor de pagamento inválido');
 if(cents(amt)>cents(inv.uncovered))throw new Error('Pagamento maior que o saldo pendente da fatura');
 if(o.date&&!RXD.test(o.date))throw new Error('Data de pagamento inválida');
 const sch=!!o.schedule||!!(o.date&&o.date>today());
 if(o.accountId&&!S.accts.some(a=>a.id===o.accountId))throw new Error('Conta inexistente');
 const {pay,linked}=buildInvoicePayment(card,month,S.tx,{accountId:S.accts[0]?.id,paidBefore:inv.paid,...o,amount:amt,schedule:sch});
 await DB.putMany('transactions',[pay,...linked]);
 await load();return pay;
}
async function addTransfer({from,to,amount,date,description}){
 const v=money(amount);
 if(!(v>0))throw new Error('Valor inválido');
 if(from===to)throw new Error('Origem e destino devem ser diferentes');
 if(!S.accts.some(a=>a.id===from)||!S.accts.some(a=>a.id===to))throw new Error('Conta inexistente');
 const d=date||today();
 await DB.put('transactions',{id:uid(),type:'transferencia',description:description||'Transferência entre contas',amount:v,date:d,dueDate:d,paidDate:d,status:'pago',accountId:from,toAccountId:to});
 await load();
}

/* ===== Gráficos SVG ===== */
function barChart(labels,r,rp,d,dp){
 const W=560,H=210,p=26,tot=labels.map((_,i)=>Math.max(r[i]+rp[i],d[i]+dp[i])),max=Math.max(1,...tot)*1.1,ch=H-p*1.5,bw=(W-p*2)/labels.length;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
 for(let i=0;i<=4;i++){const y=p/2+ch*i/4;s+=`<line class="gl" x1="${p}" x2="${W-6}" y1="${y}" y2="${y}"/>`}
 s+=`<text class="ax" x="2" y="${p/2+4}">${Math.round(max/1000)}k</text>`;
 labels.forEach((l,i)=>{
  const x=p+i*bw+bw*.18,w=bw*.3,base=H-p,h=v=>ch*v/max;
  const bar=(x0,real,prev,col,nm)=>{const hr=h(real),hp=h(prev);
   return `<rect x="${x0}" y="${base-hr}" width="${w}" height="${hr}" rx="4" fill="${col}"><title>${nm} realizadas: ${brl(real)}</title></rect>`+(prev>0?`<rect x="${x0}" y="${base-hr-hp}" width="${w}" height="${hp}" rx="4" fill="${col}" fill-opacity=".35"><title>${nm} previstas: ${brl(prev)}</title></rect>`:'')};
  s+=bar(x,r[i],rp[i],'var(--ok)','Receitas')+bar(x+w+4,d[i],dp[i],'var(--bad)','Despesas')+`<text class="ax" x="${p+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${l}</text>`});
 return s+'</svg>';
}
function lineChart(labels,v,t){
 const W=560,H=190,p=26,max=Math.max(1,...v,...t)*1.15,ch=H-p*1.6,step=(W-p*2)/Math.max(1,v.length-1);
 const P=a=>a.map((y,i)=>[p+i*step,H-p-ch*y/max]),pts=P(v),pt=P(t),D=q=>q.map((z,i)=>(i?'L':'M')+z[0].toFixed(1)+' '+z[1].toFixed(1)).join(' ');

function donut(items){
 const vis=items.filter(i=>i.v>0),tot=sum(vis,i=>i.v);
 if(!(tot>0))return '<div class="empty">Sem despesas neste mês.</div>';
 const R=52,C=2*Math.PI*R;let acc=0;
 const segs=vis.map(i=>{const len=C*i.v/tot,o=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${i.c}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"><title>${esc(i.n)}: ${brl(i.v)}</title></circle>`;acc+=len;return o}).join('');
 return `<div class="donut"><svg viewBox="0 0 140 140" width="140" height="140"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--soft)" stroke-width="18"/>${segs}<text x="70" y="66" text-anchor="middle" class="ax">Total</text><text x="70" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${brl(tot)}</text></svg><ul>${vis.map(i=>`<li style="--c:${i.c}"><span>${esc(i.n)}</span><b>${Math.round(i.v/tot*100)}%</b></li>`).join('')}</ul></div>`;
}

const download=(name,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
const b64ToBlob=(b,type)=>{const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:type||''})};
async function exportBackup(){
 const snap=await DB.run(DB.ST,'readonly',s=>DB.ST.map(n=>s[n].getAll())),data={};
 DB.ST.forEach((n,i)=>{data[n]=snap[i]});
 data.attachmentBlobs=await Promise.all(data.attachmentBlobs.map(async o=>({id:o.id,mime:o.blob?.type||'',b64:o.blob?await blobToB64(o.blob):''})));
 download(`backup-financas-${today()}.json`,new Blob([JSON.stringify({app:'financas-pessoais',schemaVersion:SCHEMA,exportedAt:new Date().toISOString(),data})],{type:'application/json'}));toast('Backup exportado');
}
/* Valida e normaliza TODO o backup em memória. Lança erro (sem tocar no banco) se algo estiver errado. */
const RXD=/^\d{4}-\d{2}-\d{2}$/,TYPES=['receita','despesa','transferencia','pagamento_fatura','amortizacao'];
function parseBackup(j){
 const bad=m=>{throw new Error(m)};
 if(!j||typeof j!=='object'||j.app!=='financas-pessoais'||!j.data||typeof j.data!=='object')bad('Arquivo não é um backup deste aplicativo');
 if(!(j.schemaVersion>=1)||j.schemaVersion>SCHEMA)bad('Versão de backup não suportada');
 const out={};
 for(const n of DB.ST){
  const a=j.data[n]===undefined?[]:j.data[n];
  if(!Array.isArray(a))bad(`Seção "${n}" inválida`);
  const ids=new Set();
  a.forEach((o,i)=>{
   if(!o||typeof o!=='object'||typeof o.id!=='string'||!o.id)bad(`${n}[${i}]: registro sem id`);
   if(ids.has(o.id))bad(`${n}: id duplicado "${o.id}"`);
   ids.add(o.id);
  });
  out[n]=a.map(o=>({...o}));
 }
 out.accounts.forEach(a=>{if(a.saldoInicial!==undefined&&(typeof a.saldoInicial!=='number'||!Number.isFinite(a.saldoInicial)))bad(`Conta ${a.id}: saldo inicial inválido`);a.saldoInicial=money(a.saldoInicial)});
 out.categories.forEach(c=>{if(c.kind!=='despesa'&&c.kind!=='receita')bad(`Categoria ${c.id}: tipo inválido`)});
 out.cards.forEach(c=>['closeDay','dueDay'].forEach(k=>{if(c[k]!==undefined&&!(Number.isInteger(c[k])&&c[k]>=1&&c[k]<=31))bad(`Cartão ${c.id}: ${k} inválido`)}));
 out.cards.forEach(c=>{c.color=safeColor(c.color)});
 out.categories.forEach(c=>{if(c.color!==undefined)c.color=safeColor(c.color)});
 out.cards.forEach(c=>{if(c.limit!==undefined&&(typeof c.limit!=='number'||!Number.isFinite(c.limit)||c.limit<0))bad(`Cartão ${c.id}: limite inválido`)});
 out.financings.forEach(f=>{if(f.saldoDevedor!==undefined&&(typeof f.saldoDevedor!=='number'||!Number.isFinite(f.saldoDevedor)))bad(`Financiamento ${f.id}: saldo devedor inválido`)});
 out.products.forEach(p=>{
  const w=`Produto ${p.id}`;
  if(typeof p.name!=='string'||!p.name.trim())bad(`${w}: nome inválido`);
  ['total','down','financed','installmentsTotal'].forEach(k=>{if(typeof p[k]!=='number'||!Number.isFinite(p[k])||p[k]<0)bad(`${w}: ${k} inválido`)});
  if(!Number.isInteger(p.n)||p.n<1)bad(`${w}: parcelas inválidas`);
  if(p.status!=='ativo'&&p.status!=='cancelado')bad(`${w}: situação inválida`);
  if(typeof p.purchaseDate!=='string'||!RXD.test(p.purchaseDate))bad(`${w}: data da compra inválida`);
 });
 out.financings.forEach(f=>{
  if(f.v!==2)return; /* legados da Etapa 1 são convertidos por migrate() */
  const w=`Financiamento ${f.id}`;
  if(typeof f.name!=='string'||!f.name.trim())bad(`${w}: nome inválido`);
  if(!Number.isInteger(f.n)||f.n<1)bad(`${w}: parcelas inválidas`);
  if(typeof f.principal!=='number'||!Number.isFinite(f.principal)||f.principal<0)bad(`${w}: valor contratado inválido`);
  if(!f.baseline||typeof f.baseline.balance!=='number'||!Number.isFinite(f.baseline.balance))bad(`${w}: saldo-base inválido`);
  if(!['ativo','quitado','cancelado'].includes(f.status))bad(`${w}: situação inválida`);
  if(f.system!==undefined&&!LSYS[f.system])bad(`${w}: sistema de amortização inválido`);
 });
 const pids=new Set(out.products.map(p=>p.id)),lids=new Set(out.financings.map(f=>f.id));
 const cm=new Map(out.cards.map(c=>[c.id,c]));
 out.transactions.forEach(t=>{
  if(t.productId!==undefined&&!pids.has(t.productId))bad(`Lançamento ${t.id}: produto inexistente`);
  if(t.loanId!==undefined&&!lids.has(t.loanId))bad(`Lançamento ${t.id}: financiamento inexistente`);
  const w=`Lançamento ${t.id}`;
  if(!TYPES.includes(t.type))bad(`${w}: tipo inválido`);
  if(typeof t.amount!=='number'||!Number.isFinite(t.amount)||t.amount<0)bad(`${w}: valor inválido`);
  if(typeof t.date!=='string'||!RXD.test(t.date))bad(`${w}: data inválida`);
  ['dueDate','paidDate'].forEach(k=>{if(t[k]!==undefined&&t[k]!==null&&!(typeof t[k]==='string'&&RXD.test(t[k])))bad(`${w}: ${k} inválida`)});
  if(t.status!=='pago'&&t.status!=='pendente')bad(`${w}: situação inválida`);
  if(t.type==='transferencia'&&(!t.accountId||!t.toAccountId||t.accountId===t.toAccountId))bad(`${w}: transferência inválida`);
  t.amount=money(t.amount);
  if(t.cardId&&t.type==='despesa'&&!t.invoiceMonth)t.invoiceMonth=invoiceMonthOf(cm.get(t.cardId),t.date);
 });
 const blobs=out.attachmentBlobs.map(o=>{
  if(typeof o.b64!=='string')bad(`Anexo ${o.id}: dados ausentes`);
  try{return{id:o.id,blob:b64ToBlob(o.b64,o.mime)}}catch(e){return bad(`Anexo ${o.id}: dados corrompidos`)}
 });
 out.attachments=out.attachments.map(a=>{ /* v1: anexos com dataUrl -> Blob separado */
  if(typeof a.dataUrl!=='string')return a;
  const m=/^data:([^;,]*);base64,(.*)$/s.exec(a.dataUrl);
  if(!m)bad(`Anexo ${a.id}: dataUrl inválida`);
  let b;try{b=b64ToBlob(m[2],m[1])}catch(e){bad(`Anexo ${a.id}: dados corrompidos`)}
  blobs.push({id:a.id,blob:b});
  const {dataUrl,...meta}=a;return{...meta,mime:m[1],size:b.size};
 });
 out.attachmentBlobs=blobs;
 return out;
}

/* ===== ETAPA 2: cartões, compras/parcelas, faturas e pagamentos =====
 Modelo (compatível com a Etapa 1, sem novas stores): compra = transações 'despesa' com cardId (uma por parcela),
 fatura = derivada em ctx() por (cardId, invoiceMonth), pagamento = transação 'pagamento_fatura' (não é consumo).
 Valores: reais com 2 casas, mas TODA aritmética em centavos inteiros. */
const BRANDS=['Visa','Mastercard','Elo','Amex','Hipercard','Outra'];
const STL={paga:['Paga','ok'],vencida:['Vencida','b'],aberta:['Aberta','w'],fechada:['Fechada','w'],proxima:['Próxima','']};
const HEX=/^#[0-9a-fA-F]{6}$/,safeColor=v=>HEX.test(v)?v:'#2563eb';
const cColor=c=>safeColor(c&&c.color);
const mlab=m=>`${MESES[+m.slice(5)-1]}/${m.slice(0,4)}`;
const F=id=>document.getElementById(id);
const setF=(f,o)=>Object.entries(o).forEach(([k,v])=>{f.elements[k].value=v??''});
const closeD=(c,m)=>{const y=+m.slice(0,4),mm=+m.slice(5);return iso(new Date(y,mm-1,Math.min(c.closeDay||31,dim(y,mm))))};
const prange=(c,m)=>{const e=new Date(closeD(c,m)+'T12:00'),s=new Date(closeD(c,shiftMonth(m,-1))+'T12:00'),px=c.closeSame==='proxima';
 s.setDate(s.getDate()+(px?0:1));if(px)e.setDate(e.getDate()-1);return[iso(s),iso(e)]};
const invStatus=(o,cur,td)=>o.charges>0&&o.open===0?'paga':o.open>0&&o.due<td?'vencida':o.month>cur?'proxima':o.month===cur?'aberta':'fechada';
function cardStats(card,X=ctx()){
 const cur=invoiceMonthOf(card,X.td),list=[...X.inv.values()].filter(o=>o.cardId===card.id);
 if(!list.some(o=>o.month===cur))list.push({cardId:card.id,month:cur,ch:0,pd:0,sc:0,charges:0,paid:0,scheduled:0,open:0,uncovered:0,due:invoiceDue(card,cur)});
 list.forEach(o=>{o.status=invStatus(o,cur,X.td)});
 list.sort((a,b)=>a.month.localeCompare(b.month));
 const used=sum(list,o=>o.open);
 return{cur,list,used,avail:(cents(card.limit)-cents(used))/100,current:list.find(o=>o.month===cur),
  future:sum(list.filter(o=>o.month>cur),o=>o.open),next:list.filter(o=>o.open>0).sort((a,b)=>a.due.localeCompare(b.due))[0]||null};
}
async function saveCard(o){
 const old=S.cards.find(c=>c.id===o.id),nc={...(old||{}),...o},upd=[];let skipped=0;
 if(old&&(old.closeDay!==nc.closeDay||old.dueDay!==nc.dueDay||(old.closeSame||'atual')!==nc.closeSame)){
  const X=ctx();
  S.tx.filter(t=>t.type==='despesa'&&t.cardId===nc.id).forEach(t=>{
   const om=t.invoiceMonth||X.ref(t),nm=t.purchaseDate&&t.instIndex?shiftMonth(invoiceMonthOf(nc,t.purchaseDate),t.instIndex-1):invoiceMonthOf(nc,t.date),nd=invoiceDue(nc,nm);
   if(nm===om&&nd===t.dueDate)return;
   if(invLocked(nc.id,[om,nm],X)){skipped++;return}
   upd.push({...t,invoiceMonth:nm,dueDate:nd});
  });
 }

/* ---- compras ---- */
function buildPurchase(p){
 const card=S.cards.find(c=>c.id===p.cardId);
 if(!card)throw new Error('Cartão não encontrado');
 const desc=String(p.description||'').trim(),n=Math.floor(Number(p.parcels)||1),tc=cents(p.total);
 if(!desc)throw new Error('Informe a descrição da compra');
 if(!(tc>0))throw new Error('Informe um valor maior que zero');
 if(!(n>=1&&n<=48))throw new Error('Parcelas: de 1 a 48');
 if(!RXD.test(p.date||''))throw new Error('Informe uma data válida');
 const im=invoiceMonthOf(card,p.date),gid=n>1?(p.groupId||uid()):undefined,base=Math.floor(tc/n),rem=tc-base*n,d=+p.date.slice(8);
 const txs=Array.from({length:n},(_,i)=>{
  const k=shiftMonth(im,i),pm=shiftMonth(p.date.slice(0,7),i),py=+pm.slice(0,4),pmm=+pm.slice(5);
  return{id:(p.ids&&p.ids[i])||uid(),type:'despesa',description:n>1?`${desc} (${i+1}/${n})`:desc,amount:(base+(i<rem?1:0))/100,
   date:iso(new Date(py,pmm-1,Math.min(d,dim(py,pmm)))),dueDate:invoiceDue(card,k),status:'pendente',accountId:S.accts[0]?.id||'acc_main',
   categoryId:p.categoryId,cardId:card.id,invoiceMonth:k,purchaseDate:p.date,merchant:p.merchant||'',notes:p.notes||'',
   ...(n>1?{installmentGroupId:gid,instIndex:i+1,instTotal:n}:{})};
 });
 const inst=n>1?{id:gid,description:desc,total:tc/100,parcels:n,firstDate:p.date,purchaseDate:p.date,cardId:card.id,categoryId:p.categoryId,merchant:p.merchant||'',notes:p.notes||''}:null;
 return{txs,inst,gid};
}
const purchaseTx=key=>{const g=S.tx.filter(t=>t.type==='despesa'&&t.installmentGroupId===key);
 return(g.length?g:S.tx.filter(t=>t.id===key&&t.type==='despesa'&&t.cardId)).sort((a,b)=>(a.instIndex||0)-(b.instIndex||0)||a.date.localeCompare(b.date))};
const invLocked=(cardId,months,X)=>months.some(m=>{const o=X.inv.get(cardId+'|'+m);return !!o&&(o.pd>0||o.sc>0)});
const LOCKMSG='Há pagamentos registrados em faturas desta compra. Estorne os pagamentos antes de alterar ou excluir.';
async function savePurchase(p){
 const X=ctx(),old=p.editKey?purchaseTx(p.editKey):[];
 if(p.editKey&&!old.length)throw new Error('Compra não encontrada');
 if(old.length&&invLocked(old[0].cardId,old.map(t=>t.invoiceMonth||X.ref(t)),X))throw new Error(LOCKMSG);
 const b=buildPurchase({...p,groupId:old[0]?.installmentGroupId,ids:old.map(t=>t.id)});
 if(invLocked(p.cardId,b.txs.map(t=>t.invoiceMonth),X))throw new Error(LOCKMSG);
const oldG=old[0]?.installmentGroupId;
 b.txs.forEach((t,i)=>{if(old[i]?.attachmentIds?.length)t.attachmentIds=old[i].attachmentIds});
 const gone=old.slice(b.txs.length),goneIds=new Set(gone.map(t=>t.id));
 await DB.run(['transactions','installments','attachments','attachmentBlobs'],'readwrite',s=>{
  old.forEach(t=>s.transactions.delete(t.id));b.txs.forEach(t=>s.transactions.put(t));
  if(gone.length){gone.forEach(t=>(t.attachmentIds||[]).forEach(a=>{s.attachments.delete(a);s.attachmentBlobs.delete(a)}));
   const rq=s.attachments.getAll();rq.onsuccess=()=>rq.result.filter(a=>goneIds.has(a.txId)).forEach(a=>{s.attachments.delete(a.id);s.attachmentBlobs.delete(a.id)})}
  if(b.inst)s.installments.put(b.inst);else if(oldG)s.installments.delete(oldG);
 });
 await load();return b;
}
async function delPurchase(key){
 const old=purchaseTx(key);if(!old.length)return;
 const X=ctx();
 if(invLocked(old[0].cardId,old.map(t=>t.invoiceMonth||X.ref(t)),X))throw new Error(LOCKMSG);
 const ids=new Set(old.map(t=>t.id)),g=old[0].installmentGroupId;
 await DB.run(['transactions','installments','attachments','attachmentBlobs'],'readwrite',s=>{
  old.forEach(t=>{s.transactions.delete(t.id);(t.attachmentIds||[]).forEach(a=>{s.attachments.delete(a);s.attachmentBlobs.delete(a)})});
  if(g)s.installments.delete(g);
  const rq=s.attachments.getAll();rq.onsuccess=()=>rq.result.filter(a=>ids.has(a.txId)).forEach(a=>{s.attachments.delete(a.id);s.attachmentBlobs.delete(a.id)});
 });
 await load();
}

/* ===== ETAPA 3A: produtos parcelados (fora do cartão) =====
 Modelo: store 'products' (cabeçalho) + transações 'despesa' (productId, kind 'entrada'|'parcela', parcelNumber), sem cardId (nunca entram em faturas).
 Competência = vencimento da parcela. O valor total da compra NÃO gera lançamento próprio (só entrada + parcelas): sem duplicidade.
 Pagamento com desconto: amount = valor EFETIVAMENTE pago; originalAmount guarda o nominal. Aritmética em centavos inteiros. */
const PAYM=['Boleto','Carnê','Crediário','PIX','Débito automático','Transferência','Dinheiro','Outro'];
const catDef=()=>(S.cats.find(c=>c.name==='Compras')||S.cats.find(c=>c.kind==='despesa')||{}).id;
let _seq=0;const nextSeq=()=>(_seq=Math.max(_seq+1,Date.now()));
const nowIso=()=>new Date().toISOString();
const logE=(a,d)=>({at:nowIso(),action:a,detail:d||''});
const addLog=(rec,a,d)=>({...rec,log:[...(rec.log||[]),logE(a,d)].slice(-300)});
const blank=v=>v===''||v===null||v===undefined;
const numOrNull=v=>blank(v)?null:Number(v);
/* vencimento da parcela k (0 = primeira) a partir da data do 1º vencimento; dia fixo opcional para as demais */
const dueOf=(first,k,day)=>{
 if(!RXD.test(first||''))return null;
 if(k===0)return first;
 const m=shiftMonth(first.slice(0,7),k),d=day||+first.slice(8);
 return `${m}-${pad(Math.min(d,dim(+m.slice(0,4),+m.slice(5))))}`;
};
const splitC=(tc,n)=>{const b=Math.floor(tc/n),r=tc-b*n;return Array.from({length:n},(_,i)=>b+(i<r?1:0))};
/* rateio proporcional em centavos (maior resto): a soma é exatamente igual ao total */
function allocC(total,weights){
 const W=weights.reduce((s,x)=>s+x,0);
 if(!(W>0))return weights.map((_,i)=>i===0?total:0);
 const raw=weights.map(w=>total*w/W),fl=raw.map(Math.floor);let rem=total-fl.reduce((s,x)=>s+x,0);
 const ord=raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
 for(let j=0;j<rem;j++)fl[ord[j][1]]++;
 return fl;
}
const monthlyRate=(rate,type)=>{
 if(blank(rate))return null;const r=Number(rate)/100;
 if(!Number.isFinite(r)||r<0)return null;
 return type==='anual'?Math.pow(1+r,1/12)-1:r; /* anual = taxa efetiva (equivalente mensal composta) */
};
const pricePmt=(Bc,n,i)=>i>0?Math.round(Bc*i/(1-Math.pow(1+i,-n))):Math.round(Bc/n);
/* taxa mensal implícita ESTIMADA (bissecção) a partir do valor financiado e das parcelas */
function impliedRate(financedC,amts){
 if(amts.reduce((s,a)=>s+a,0)<=financedC)return null;
 const pv=r=>amts.reduce((s,a,k)=>s+a/Math.pow(1+r,k+1),0);
 let lo=0,hi=1;while(pv(hi)>financedC&&hi<1e4)hi*=2;
 for(let k=0;k<200;k++){const m=(lo+hi)/2;if(pv(m)>financedC)lo=m;else hi=m}
 return (lo+hi)/2;
}
const pctS=v=>v===null||v===undefined?'—':(Math.round(v*1e6)/1e4).toLocaleString('pt-BR',{maximumFractionDigits:4})+'%';

function planProduct(p){
 const err=[],warn=[];let confirm=false;
 const name=String(p.name||'').trim(),total=cents(p.total),down=cents(p.down||0),n=Math.floor(Number(p.n)||0);
 const mode=['sem_juros','com_juros','manual'].includes(p.mode)?p.mode:'sem_juros';
 const dd=blank(p.dueDay)?null:Math.floor(Number(p.dueDay));
 const acc=p.accountId||S.accts[0]?.id,rate=numOrNull(p.rate);
 if(!name)err.push('Informe o nome do produto ou serviço');
 if(!(total>0))err.push('Informe o valor total');
 if(down<0||down>total)err.push('Entrada inválida: deve estar entre zero e o valor total');
 if(!RXD.test(p.purchaseDate||''))err.push('Informe a data da compra');
 if(!(n>=1&&n<=120))err.push('Quantidade de parcelas: de 1 a 120');
 if(!RXD.test(p.firstDue||''))err.push('Informe a data do primeiro vencimento');
 if(dd!==null&&!(dd>=1&&dd<=31))err.push('Dia de vencimento: de 1 a 31');
 if(!S.accts.some(a=>a.id===acc))err.push('Conta bancária inexistente');
 if(rate!==null&&!(rate>=0&&Number.isFinite(rate)))err.push('Taxa de juros inválida');
 let financed=blank(p.financed)?total-down:cents(p.financed);
 if(!(financed>0))err.push('Não há saldo a parcelar: o valor financiado deve ser maior que zero');
 if(err.length)return{ok:false,err,warn,confirm};
 if(financed!==total-down){warn.push(`Valor financiado informado (${brl(financed/100)}) difere de total − entrada (${brl((total-down)/100)}).`);confirm=true}
 let amts,dues;
 if(mode==='manual'){
  const rows=p.manual||[];
  if(rows.length!==n)err.push('Informe valor e vencimento de todas as parcelas');
  else{
   amts=rows.map(r=>cents(r.amount));dues=rows.map(r=>r.due);
   if(amts.some(a=>!(a>0)))err.push('Todas as parcelas devem ter valor maior que zero');
   if(dues.some(d=>!RXD.test(d||'')))err.push('Todas as parcelas devem ter um vencimento válido');
  }
 }else{
  let par=blank(p.parcela)?null:cents(p.parcela);
  if(par!==null&&!(par>0))err.push('Valor da parcela inválido');
  if(mode==='com_juros'&&par===null){
   if(rate!==null){par=pricePmt(financed,n,monthlyRate(rate,p.rateType));warn.push('Valor da parcela ESTIMADO pela tabela Price com a taxa informada — confira com o carnê ou contrato.')}
   else err.push('Compra com juros: informe o valor da parcela (ou a taxa de juros para uma estimativa)');
  }
  if(!err.length){amts=par===null?splitC(financed,n):Array(n).fill(par);dues=amts.map((_,k)=>dueOf(p.firstDue,k,dd))}
 }
 if(err.length)return{ok:false,err,warn,confirm};
 const S0=amts.reduce((s,a)=>s+a,0),diff=S0-financed;
 if(mode==='sem_juros'){
  if(diff!==0){warn.push(`A soma das parcelas (${brl(S0/100)}) difere do valor financiado (${brl(financed/100)}) em ${brl(Math.abs(diff)/100)}. Se há juros, use a modalidade "Com juros".`);confirm=true}
  if(rate!==null&&rate>0)warn.push('Taxa de juros informada, mas a modalidade é "Sem juros".');
 }else{
  if(diff<0){warn.push(`As parcelas somam menos (${brl(S0/100)}) que o valor financiado (${brl(financed/100)}).`);confirm=true}

async function commit3({tx=[],delTx=[],products=[],delProducts=[],loans=[],delLoans=[],guards=[]}){
 let gErr=null;const delSet=new Set(delTx);
 const oldDel=S.tx.filter(t=>delSet.has(t.id));
 try{
  await DB.run(['transactions','products','financings','attachments','attachmentBlobs'],'readwrite',s=>{
   guards.forEach(g=>{const rq=s.transactions.get(g.id);rq.onsuccess=()=>{if(!g.ok(rq.result)){gErr=new Error(g.msg);throw gErr}}});
   delTx.forEach(id=>s.transactions.delete(id));
   tx.forEach(t=>s.transactions.put(t));
   products.forEach(p=>s.products.put(p));delProducts.forEach(id=>s.products.delete(id));
   loans.forEach(l=>s.financings.put(l));delLoans.forEach(id=>s.financings.delete(id));
   oldDel.forEach(t=>(t.attachmentIds||[]).forEach(a=>{s.attachments.delete(a);s.attachmentBlobs.delete(a)}));
   if(delSet.size||delProducts.length||delLoans.length){const dp=new Set(delProducts),dl=new Set(delLoans),rq=s.attachments.getAll();rq.onsuccess=()=>rq.result.filter(a=>delSet.has(a.txId)||(a.ownerType==='product'&&dp.has(a.ownerId))||(a.ownerType==='loan'&&dl.has(a.ownerId))).forEach(a=>{s.attachments.delete(a.id);s.attachmentBlobs.delete(a.id)})}
  });
 }catch(e){throw gErr||e}
 await load();
}

 const kind=o.kind||'pagamento';
 if(kind==='pagamento'&&ts.length!==1)throw new Error('Pagamento individual: selecione uma parcela');

/* ===== ETAPA 3B: financiamentos e empréstimos =====
 Contrato -> store 'financings' (v:2); prestações -> transações 'despesa' (loanId, kind 'prestacao'); amortização extraordinária -> type 'amortizacao'.
 Valor contratado e saldo devedor NÃO geram lançamentos. Prestações pendentes são ESTIMADAS (estimated:true) até o pagamento real. */
const LKINDS={imobiliario:'Financiamento imobiliário',veiculo:'Financiamento de veículo',pessoal:'Empréstimo pessoal',consignado:'Crédito consignado',equipamento:'Financiamento de equipamentos',outro:'Outro'};
const LSYS={SAC:'SAC',PRICE:'PRICE',OUTRO:'Outro',NI:'Não informado'};
const catFin=()=>(S.cats.find(c=>c.name==='Financiamentos')||S.cats.find(c=>c.kind==='despesa')||{}).id;
function genRows(o){
 const {sys,i,encC=0,startNum,due}=o,rows=[];let B=o.B;
 if(sys==='CONST'){
  for(let k=0;k<o.nrem;k++)rows.push({num:startNum+k,due:due(startNum+k),amort:null,interest:null,fees:null,total:o.constTotal,balance:null});
  return rows;
 }
 if(!(B>0))return rows;
 const push=(num,am,it)=>{rows.push({num,due:due(num),amort:am,interest:it,fees:encC,total:am+it+encC,balance:B-am});B-=am};
 if(sys==='SAC'){
  const A=o.amort!==undefined?o.amort:Math.floor(B/o.nrem);if(!(A>0))return rows;
  for(let k=0;B>0&&k<1200;k++){const it=Math.round(B*i),last=(o.amort===undefined&&k===o.nrem-1)||B<=A;push(startNum+k,last?B:A,it)}
 }else{
  const P=o.pmt!==undefined?o.pmt:pricePmt(B,o.nrem,i);
  for(let k=0;B>0&&k<1200;k++){const it=Math.round(B*i);let am=P-it;const last=(o.pmt===undefined&&k===o.nrem-1)||am>=B;if(last)am=B;if(am<=0)return null;push(startNum+k,am,it)}
 }
 return rows;
}
function loanState(l,txs=S.tx){
 const mine=txs.filter(t=>t.loanId===l.id),pr=mine.filter(t=>t.type==='despesa');
 const paid=pr.filter(t=>t.status==='pago').sort((a,b)=>a.parcelNumber-b.parcelNumber);
 const pend=pr.filter(t=>t.status!=='pago').sort((a,b)=>a.parcelNumber-b.parcelNumber);
 const am=mine.filter(t=>t.type==='amortizacao').sort((a,b)=>(a.paySeq||0)-(b.paySeq||0));
 const b=l.baseline||{balance:l.saldoDevedor||0,seq:0,source:'informado'},after=t=>(t.paySeq||0)>(b.seq||0);
 const prinC=paid.filter(after).reduce((s,t)=>s+cents(t.principal||0),0),exC=am.filter(after).reduce((s,t)=>s+cents(t.amount),0);
 const estC=Math.max(0,cents(b.balance)-prinC-exC),n=l.n||l.parcels||0,paidCount=(l.paidBefore||0)+paid.length;
 const none=!paid.filter(after).length&&!am.filter(after).length;
 return{paid,pend,am,paidCount,remaining:Math.max(0,n-paidCount),estC,informedC:b.source==='extrato'&&none?cents(b.balance):null,next:pend[0]||null,
  totalPaidC:paid.reduce((s,t)=>s+cents(t.amount),0),interestPaidC:paid.reduce((s,t)=>s+cents(t.interest||0),0),
  principalPaidC:paid.reduce((s,t)=>s+cents(t.principal||0),0),feesPaidC:paid.reduce((s,t)=>s+cents(t.fees||0),0),
  amortC:am.reduce((s,t)=>s+cents(t.amount),0),paidOff:pend.length===0&&(paidCount>=n||estC<=0)};
}

/* gera/regera as prestações PENDENTES a partir do saldo estimado atual (pagas e amortizações nunca são alteradas) */
function replanLoan(l,txs,o={}){
 const v=loanState(l,txs),i=monthlyRate(l.rate,l.rateType),encC=cents(l.insurance||0)+cents(l.fees||0),sys=l.system;

  if(canSim){rows=genRows({sys,i,encC,nrem,B:v.estC,startNum,due,amort:o.amort,pmt:o.pmt});kind='calculado'}
  else if(!blank(l.firstInstallment)&&cents(l.firstInstallment)>0){rows=genRows({sys:'CONST',constTotal:cents(l.firstInstallment),nrem,startNum,due});kind='simplificado'}
 }
 if(rows===null)throw new Error('A prestação informada não cobre os juros do período: verifique taxa e valores.');
 if(!l.firstDue)rows=[];
 const nTot=v.paidCount+rows.length,old=new Map(v.pend.map(t=>[t.parcelNumber,t]));
 const put=rows.map(r=>{const o0=old.get(r.num),c=x=>x===null?null:x/100;
  return{...(o0?{attachmentIds:o0.attachmentIds}:{}),id:o0?.id||uid(),type:'despesa',description:`${l.name} (${r.num}/${nTot})`,amount:r.total/100,date:r.due,dueDate:r.due,status:'pendente',
   accountId:l.accountId||S.accts[0]?.id||'acc_main',categoryId:catFin(),loanId:l.id,parcelNumber:r.num,parcelCount:nTot,kind:'prestacao',estimated:true,
   principal:c(r.amort),interest:c(r.interest),fees:c(r.fees),balanceAfter:c(r.balance),...(l.demo?{demo:true}:{})}});
 const keep=new Set(put.map(t=>t.id));
 return{put,del:v.pend.filter(t=>!keep.has(t.id)).map(t=>t.id),rows,kind,nTot,canSim};
}

function planLoan(p){

 if(!(n>=1&&n<=480))err.push('Quantidade de parcelas: de 1 a 480');

 ['insurance','fees','firstInstallment','received','down'].forEach(k=>{if(!blank(p[k])&&!(Number(p[k])>=0))err.push('Valores monetários não podem ser negativos')});
 if(!S.accts.some(a=>a.id===acc))err.push('Conta bancária inexistente');

 const id=p.id||uid(),stamp=nowIso(),seq=nextSeq();

  warn.push(`Saldo devedor ESTIMADO pelo sistema após ${pb} parcela(s) paga(s): ${brl(base.balance)}. Informe o saldo do extrato para maior precisão.`);
 }else err.push('Contrato em andamento: informe o saldo devedor atual (extrato) — sem sistema SAC/PRICE e taxa não é possível estimá-lo');
 if(err.length)return{ok:false,err,warn};
 const loan={id,name,institution:String(p.institution||'').trim(),kind:LKINDS[p.kind]?p.kind:'outro',contractDate:p.contractDate,principal:principal/100,received:blank(p.received)?null:money(p.received),
  downPayment:blank(p.down)?0:money(p.down),rate,rateType:rate===null?null:rt,system:sys,n,nOriginal:n,firstInstallment:blank(p.firstInstallment)?null:money(p.firstInstallment),
  firstDue:blank(p.firstDue)?null:p.firstDue,dueDay:dd,insurance:money(p.insurance||0),fees:money(p.fees||0),paidBefore:pb,baseline:base,accountId:acc,
  notes:String(p.notes||'').trim(),status:'ativo',v:2,createdAt:stamp,

async function payLoanInstallment(o){
 const l=S.fin.find(x=>x.id===o.loanId);if(!l||l.v!==2)throw new Error('Financiamento não encontrado');
 if(l.status==='cancelado')throw new Error('Contrato cancelado');
 const v=loanState(l);if(v.paidOff)throw new Error('Contrato já quitado');
 const date=o.date||today();chkDate(date);const acc=chkAcc(o.accountId);
 const paid=cents(o.paid);if(!(paid>0))throw new Error('Informe o valor efetivamente pago');
 const it=blank(o.interest)?null:cents(o.interest),fe=blank(o.fees)?null:cents(o.fees);
 if((it!==null&&it<0)||(fe!==null&&fe<0))throw new Error('Juros e encargos não podem ser negativos');
 let t=o.txId?S.tx.find(x=>x.id===o.txId):v.next;
 const guards=[];
 if(t){
  if(t.loanId!==l.id||t.type!=='despesa')throw new Error('Prestação inválida');
  if(t.status==='pago')throw new Error('Prestação já paga: baixa duplicada bloqueada');
  if(t.id!==v.next?.id)throw new Error(`Pague as prestações em ordem: a próxima é a ${v.next.parcelNumber}/${v.next.parcelCount}`);
  guards.push(pendGuard(t.id));
 }else t={id:uid(),type:'despesa',description:`${l.name} (${v.paidCount+1}/${l.n})`,date,dueDate:date,status:'pendente',accountId:acc,categoryId:catFin(),loanId:l.id,parcelNumber:v.paidCount+1,parcelCount:l.n,kind:'prestacao',amount:paid/100,...(l.demo?{demo:true}:{})};
 const estC=cents(t.amount);
 let prin,intr,fees,src;
 if(it!==null||fe!==null){
  intr=it??0;fees=fe??0;prin=paid-intr-fees;
  if(prin<0)throw new Error('Juros + encargos não podem exceder o valor pago');
  src='informado';
 }else{
  const ep=cents(t.principal||0),ei=cents(t.interest||0),ef=cents(t.fees||0);src='estimado';
  if(t.estimated&&t.principal!==null&&t.principal!==undefined){
   if(paid===estC){prin=ep;intr=ei;fees=ef}
   else{prin=Math.min(ep,paid);intr=Math.min(ei,paid-prin);fees=paid-prin-intr} /* diferença tratada como encargos/desconto */
  }else{prin=null;intr=null;fees=null;src='desconhecido'}
 }

  principal:prin===null?null:prin/100,interest:intr===null?null:intr/100,fees:fees===null?null:fees/100,splitSource:src,payNotes:String(o.notes||'').trim()};
 if(t2.estimatedAmount===undefined)delete t2.estimatedAmount;
 if(prin===null){ /* sem separação: assume que todo o valor pago amortiza o saldo apenas se informado; senão não altera o saldo */
  t2.principal=0;t2.interest=0;t2.fees=0;
 }
 const rp=replanLoan(l,projTx(S.tx,{tx:[t2]}));
 await saveLoanPlan(l,S.tx,{extra:[t2],put:rp.put,del:rp.del,guards},{log:'prestação paga',logDetail:`${t.parcelNumber}/${t.parcelCount}: ${brl(paid/100)} em ${fdate(date)}${src==='informado'?` (juros ${brl(intr/100)}, encargos ${brl(fees/100)}, amortização ${brl(prin/100)})`:src==='estimado'?' (composição estimada)':' (composição não informada)'}`});
 return t2;
}

function simulateAmort(l,txs,amountC){
 const v=loanState(l,txs),i=monthlyRate(l.rate,l.rateType),sys=l.system,encC=cents(l.insurance||0)+cents(l.fees||0),pend=v.pend;
 const sumI=a=>a.reduce((s,t)=>s+cents(t.interest||0),0);
 const out={B0:v.estC,B1:Math.max(0,v.estC-amountC),can:false,reason:'',before:{n:pend.length,first:pend[0]?cents(pend[0].amount):null,interest:sumI(pend)},prazo:null,prestacao:null};
 if(!((sys==='SAC'||sys==='PRICE')&&i!==null)){out.reason='Simulação indisponível: sistema Outro/Não informado ou taxa não informada. A amortização será registrada e o saldo estimado reduzido; atualize prestações e saldo conforme o banco.';return out}
 if(!pend.length||pend[0].principal===null||pend[0].principal===undefined){out.reason='Simulação indisponível: não há prestações calculadas pendentes.';return out}
 out.can=true;
 const startNum=v.paidCount+1,due=num=>dueOf(l.firstDue,num-1,l.dueDay),f=pend[0],A=cents(f.principal),P=A+cents(f.interest);
 const sm=rows=>rows?{n:rows.length,first:rows[0]?rows[0].total:0,interest:rows.reduce((s,r)=>s+r.interest,0),rows}:null;
 out.prazo=sm(sys==='SAC'?genRows({sys,i,encC,B:out.B1,startNum,due,amort:A}):genRows({sys,i,encC,B:out.B1,startNum,due,pmt:P}));
 out.prestacao=sm(genRows({sys,i,encC,nrem:pend.length,B:out.B1,startNum,due}));
 [out.prazo,out.prestacao].forEach(s=>{if(s)s.saving=out.before.interest-s.interest});
 out.params={A,P};
 return out;
}
